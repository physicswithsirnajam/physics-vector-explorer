name: Validate Grade XI Unit 5 Original 16-MCQ Mini-Practice (V50)
on:
  pull_request:
    paths:
      - "portal/unit-05*"
      - "portal/learning-catalog.json"
      - "question-bank/grade-11/unit-05*"
      - "scripts/test_unit05_*.cjs"
      - "quality/grade11-unit05-mcq-practice-v50.md"
      - ".github/workflows/validate-grade11-unit5-mcq-v50.yml"
  push:
    branches: [main]
    paths:
      - "portal/unit-05*"
      - "portal/learning-catalog.json"
      - "question-bank/grade-11/unit-05*"
      - "scripts/test_unit05_*.cjs"
      - "quality/grade11-unit05-mcq-practice-v50.md"
      - ".github/workflows/validate-grade11-unit5-mcq-v50.yml"
  workflow_dispatch:
jobs:
  source-bank-and-browser-print:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax and JSON bank shape
        run: |
          node --check portal/unit-05-mcq-practice.js
          node --check portal/unit-05-mcq-key.js
          node --check scripts/test_unit05_mcq_v50.cjs
          node -e "const s=require('./question-bank/grade-11/unit-05-v50-16-student.json'); const k=require('./question-bank/grade-11/unit-05-v50-16-teacher-key.json');if(s.questions.length!==16||k.answerKeys.length!==16||s.structure.practiceMarks!==8)process.exit(1)"
      - name: Install pinned Playwright Chromium in CI only
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify 16 question/option/bubble and source-matched teacher key in real Chromium
        run: node scripts/test_unit05_mcq_v50.cjs
      - name: Capture student/teacher desktop, mobile and source preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit05-v50-16-mcq-classroom-print-and-key-previews
          path: qa-artifacts/unit05-v50/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Revalidate official FBISE Unit 5 audit in browser
        run: node scripts/test_unit05_fbise_audit_v49.cjs
      - name: Revalidate Unit 5 original physics simulations
        run: node scripts/test_unit05_work_energy_v48.cjs
      - name: Protect existing Unit 4 academic/course regressions
        run: |
          node scripts/test_unit04_rotational_foundations.cjs
          node scripts/test_unit04_centripetal_part2.cjs
          node scripts/test_unit04_weightlessness_part3.cjs
          node scripts/test_unit04_angular_momentum_part4.cjs
          node scripts/test_unit04_centrifuge_audit.cjs
          node scripts/test_unit04_mcq_v39.cjs
          node scripts/test_unit04_qc_v40.cjs
          node scripts/test_unit04_descriptive_v41.cjs
          node scripts/test_unit04_assessment_pack_v42.cjs
