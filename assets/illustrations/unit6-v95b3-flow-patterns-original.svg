<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
<title id="title">Original comparison of orderly and irregular fluid flow</title>
<desc id="desc">Two educational schematic channels are shown. The left shows multiple smooth, gently curving, nonintersecting paths with arrows representing ordered or laminar flow. The right shows paths with variable directions and several curved eddy loops, representing a qualitative turbulent pattern. This is not a measurement or an exact copy of NBF Figure 6.6; in real flow streamlines at one instant have a well-defined local direction and can curve without implying turbulence.</desc>
<rect width="900" height="350" rx="18" fill="#f7fbff"/>
<rect x="25" y="55" width="405" height="255" rx="16" fill="#e5f5fd" stroke="#a8cdda" stroke-width="2"/>
<rect x="470" y="55" width="405" height="255" rx="16" fill="#fff2e6" stroke="#ddbd98" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#223b56">
<text x="50" y="37" font-size="25" font-weight="750">Smooth / orderly flow</text>
<text x="495" y="37" font-size="25" font-weight="750">Irregular / mixing flow</text>
<text x="50" y="331" font-size="17">Lines remain separate and ordered</text>
<text x="495" y="331" font-size="17">Eddies indicate disturbed flow</text>
</g>
