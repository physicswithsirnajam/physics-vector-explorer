name: Validate Grade XI Unit 6 Topic 6.4 Detailed Study (V95-B4)
on:
  pull_request:
    paths:
      - "portal/unit-06-topic-64-study-v95b4.html"
      - "portal/unit-06-topic-64-study-v95b4.js"
      - "portal/unit-06-learning-desk-v95a.html"
      - "assets/illustrations/unit6-v95b4-continuity-pipe-original.svg"
      - "assets/illustrations/unit6-v95b4-branching-original.svg"
      - "quality/grade11-unit06-v95b4-topic64-student-lesson-source-and-signoff.md"
      - "scripts/test_grade11_unit06_v95b4_topic64_study.cjs"
      - ".github/workflows/validate-grade11-unit06-topic64-study-v95b4.yml"
  push:
    branches: [main]
    paths:
      - "portal/unit-06-topic-64-study-v95b4.html"
      - "portal/unit-06-topic-64-study-v95b4.js"
      - "portal/unit-06-learning-desk-v95a.html"
      - "assets/illustrations/unit6-v95b4-continuity-pipe-original.svg"
      - "assets/illustrations/unit6-v95b4-branching-original.svg"
      - "quality/grade11-unit06-v95b4-topic64-student-lesson-source-and-signoff.md"
      - "scripts/test_grade11_unit06_v95b4_topic64_study.cjs"
      - ".github/workflows/validate-grade11-unit06-topic64-study-v95b4.yml"
  workflow_dispatch:
jobs:
  topic64-conservation-and-branching:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Topic6.4 science, source, calculations and earlier topics
        run: |
          node --check portal/unit-06-topic-64-study-v95b4.js
          node --check scripts/test_grade11_unit06_v95b4_topic64_study.cjs
          node scripts/test_grade11_unit06_v95b4_topic64_study.cjs
          node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
          node scripts/test_grade11_unit06_v95a_learning_desk.cjs
          node scripts/test_grade11_unit06_v95b1_topic61_study.cjs
          node scripts/test_grade11_unit06_v95b2_topic62_study.cjs
          node scripts/test_grade11_unit06_v95b3_topic63_study.cjs
      - name: Install Chromium for 390px mobile, tablet and desktop
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify mobile layout, accessible drawings and two continuity calculators
        run: node scripts/test_grade11_unit06_v95b4_topic64_study.cjs --browser
