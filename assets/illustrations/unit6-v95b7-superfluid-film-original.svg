<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" role="img" aria-labelledby="title desc">
<title id="title">Original educational superfluid thin-film wall creep diagram</title>
<desc id="desc">Open container with helium liquid inside. A thin blue line traces a possible surface film along the inside wall up to the exposed rim, then down the outside wall toward a small drop. Arrows indicate a possible surface path, not bulk liquid leaping over the rim. A sealed vessel without an exposed continuous path would not permit this same route. This drawing is independently created, schematic and not a copy of NBF Figure 6.16.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087da9"/></marker></defs>
<rect width="940" height="410" rx="16" fill="#f8fbff"/>
<text x="32" y="39" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#213c5a">Thin superfluid film can follow a surface over an open rim</text>
