name: Grade XI V182 Unit7 Private Teacher Batch04 12 Original MCQs (HOLD)
on:
  pull_request:
    paths:
      - "quality/unit07/unit07-v182-batch04-twelve-originals-private-candidates-keyless.json"
      - "quality/grade11-v182-unit07-batch04-12-private-teacher-review-qc.md"
      - "scripts/audit_grade11_unit07_teacher_batch04_v182.cjs"
      - ".github/workflows/validate-grade11-v182-unit07-private-teacher-batch04.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/unit07-v182-batch04-twelve-originals-private-candidates-keyless.json"
      - "quality/grade11-v182-unit07-batch04-12-private-teacher-review-qc.md"
      - "scripts/audit_grade11_unit07_teacher_batch04_v182.cjs"
      - ".github/workflows/validate-grade11-v182-unit07-private-teacher-batch04.yml"
  workflow_dispatch:
jobs:
  validate-source-private-candidates-and-no-scored-unit7:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check V182 source-private academic validator
        run: node --check scripts/audit_grade11_unit07_teacher_batch04_v182.cjs
      - name: Audit exact 12 original row hashes, previous 36 disjointness, 39 no-score failures
        run: node scripts/audit_grade11_unit07_teacher_batch04_v182.cjs
      - name: Preserve V181 original 12 private teacher candidate safeguards
        run: node scripts/audit_grade11_unit07_teacher_batch03_v181.cjs
      - name: Preserve V180 original 12 private teacher candidate safeguards
        run: node scripts/audit_grade11_unit07_teacher_batch02_v180.cjs
      - name: Preserve V179 original 12 private teacher candidate safeguards
        run: node scripts/audit_grade11_unit07_teacher_batch01_v179.cjs
      - name: Preserve V178 original 274-question academic teacher index
        run: node scripts/audit_grade11_unit07_teacher_approval_index_v178.cjs
      - name: Preserve V177 five original numerical questions and answer-hint HOLD
        run: node scripts/audit_grade11_unit07_numericals_v177.cjs
      - name: Preserve V176 eight original comprehensive-question rubrics
        run: node scripts/audit_grade11_unit07_comprehensive_v176.cjs
      - name: Preserve V175 eleven original short-response questions
        run: node scripts/audit_grade11_unit07_short_v175.cjs
      - name: Preserve V174 ten original textbook MCQ quality flags
        run: node scripts/audit_grade11_unit07_exercise_mcq_v174.cjs
      - name: Preserve 240 owner original Topic7.1-7.3 question source records
        run: |
          node scripts/audit_grade11_unit7_topic73_bank_v173.cjs
          node scripts/audit_grade11_unit7_topic72_bank_v168.cjs
          node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve Grade XI original 2250 pinned MCQ source identities
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve Unit6 original 560 pending teacher release matrix
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve teacher backend staging production deployment NO-GO
        run: |
          node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
          node scripts/audit_grade11_v161_staging_callable_contract.cjs
      - name: Preserve App Check entrypoints and reporting launch lock
        run: |
          node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
          node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Upload counts-only QA proof, no original or candidate answer payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v182-unit7-private-teacher-batch04-keyless-qa
          path: qa-artifacts/grade11-v182-unit7-private-teacher-batch04/summary.json
          if-no-files-found: warn
          retention-days: 14
