<svg xmlns="http://www.w3.org/2000/svg" width="720" height="670" viewBox="0 0 720 670" role="img" aria-labelledby="title desc">
  <title id="title">Rectangular plate, centre versus corner rotation axis</title>
  <desc id="desc">Original educational schematic based on the two rectangular-plate entries of NBF Grade XI Physics Figure 4.13, printed page 64. The first plate rotates about an axis perpendicular through its centre, with moment of inertia one twelfth M times a squared plus b squared. The second plate rotates about a perpendicular axis through one corner, with moment of inertia one third M times a squared plus b squared. The plate mass and dimensions are unchanged.</desc>
  <rect width="720" height="670" rx="18" fill="#f6f8fc"/>
  <text x="26" y="47" font-size="26" font-family="system-ui, sans-serif" font-weight="700" fill="#142b4e">Rectangular plate: compare rotation axes</text>
  <text x="26" y="77" font-size="17" font-family="system-ui, sans-serif" fill="#455b77">Original explanatory schematic based on NBF Fig. 4.13, textbook p. 64</text>
  <g font-family="system-ui, sans-serif">
    <rect x="24" y="97" width="672" height="256" rx="14" fill="#fff" stroke="#cfdaea" stroke-width="2"/>
    <text x="43" y="131" font-size="25" font-weight="700" fill="#142b4e">A. Axis through the centre</text>
    <text x="43" y="155" font-size="16" fill="#51667e">Perpendicular to the plate</text>
    <rect x="176" y="187" width="365" height="112" rx="3" fill="#d9e7f9" stroke="#2f629c" stroke-width="4"/>
    <path d="M176 174V166 M541 174V166 M176 168H541" fill="none" stroke="#526882" stroke-width="2"/>
    <text x="358" y="160" font-size="20" text-anchor="middle" fill="#263f5b">a</text>
    <path d="M162 187H153 M162 299H153 M157 187V299" fill="none" stroke="#526882" stroke-width="2"/>
    <text x="138" y="246" font-size="20" text-anchor="middle" fill="#263f5b">b</text>
    <circle cx="358.5" cy="243" r="20" fill="#fff" stroke="#c44b32" stroke-width="4"/>
    <circle cx="358.5" cy="243" r="7" fill="#c44b32"/>
    <text x="388" y="241" font-size="16" fill="#97351f">axis ⊙</text>
    <text x="43" y="336" font-size="24" font-weight="700" fill="#142b4e">I = (1/12) M(a² + b²)</text>
    <rect x="24" y="370" width="672" height="256" rx="14" fill="#fff" stroke="#cfdaea" stroke-width="2"/>
    <text x="43" y="405" font-size="25" font-weight="700" fill="#142b4e">B. Axis through a corner</text>
    <text x="43" y="429" font-size="16" fill="#51667e">Perpendicular to the same plate</text>
    <rect x="176" y="459" width="365" height="112" rx="3" fill="#d9e7f9" stroke="#2f629c" stroke-width="4"/>
    <path d="M176 446V438 M541 446V438 M176 440H541" fill="none" stroke="#526882" stroke-width="2"/>
    <text x="358" y="432" font-size="20" text-anchor="middle" fill="#263f5b">a</text>
    <path d="M162 459H153 M162 571H153 M157 459V571" fill="none" stroke="#526882" stroke-width="2"/>
    <text x="138" y="518" font-size="20" text-anchor="middle" fill="#263f5b">b</text>
    <circle cx="176" cy="459" r="20" fill="#fff" stroke="#c44b32" stroke-width="4"/>
    <circle cx="176" cy="459" r="7" fill="#c44b32"/>
    <text x="204" y="481" font-size="16" fill="#97351f">axis ⊙</text>
    <text x="43" y="607" font-size="24" font-weight="700" fill="#142b4e">I = (1/3) M(a² + b²)</text>
    <text x="28" y="655" font-size="17" fill="#455b77">Same mass and size • Only the axis changes • ⊙ means axis out of the page</text>
  </g>
</svg>
