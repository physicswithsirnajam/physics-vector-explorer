name: Grade XI V188 Two Real Private Candidate Identity Pilots (NO SCORE)
on:
  pull_request:
    paths:
      - "quality/unit07/unit07-v188-private-two-item-pilot-no-keys.json"
      - "quality/grade11-v188-unit07-two-real-private-candidate-pilot-review.md"
      - "scripts/audit_grade11_unit07_private_pilot_v188.cjs"
      - ".github/workflows/validate-grade11-v188-unit07-private-pilot-no-deploy.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/unit07-v188-private-two-item-pilot-no-keys.json"
      - "quality/grade11-v188-unit07-two-real-private-candidate-pilot-review.md"
      - "scripts/audit_grade11_unit07_private_pilot_v188.cjs"
      - ".github/workflows/validate-grade11-v188-unit07-private-pilot-no-deploy.yml"
  workflow_dispatch:
jobs:
  verify-two-source-identity-references-private-digests-withheld:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check V188 public-only source metadata audit syntax
        run: node --check scripts/audit_grade11_unit07_private_pilot_v188.cjs
      - name: Validate two original source references, withheld digests, and zero-score mutations
        run: node scripts/audit_grade11_unit07_private_pilot_v188.cjs
      - name: Preserve V187 synthetic private manifest testing and path restrictions
        run: node scripts/test_grade11_unit07_private_manifest_v187.cjs
      - name: Preserve V186 synthetic-only question revision and revocation checks
        run: node scripts/test_grade11_unit07_offline_protocol_v186.cjs
      - name: Preserve V185 source-bound 72 private candidate review readiness gates
        run: node scripts/audit_grade11_unit07_teacher_readiness_v185.cjs
      - name: Preserve V184 twelve private source review candidates and zero scored
        run: node scripts/audit_grade11_unit07_teacher_batch06_v184.cjs
      - name: Preserve V183 twelve private source review candidates and zero scored
        run: node scripts/audit_grade11_unit07_teacher_batch05_v183.cjs
      - name: Preserve V182 twelve private source review candidates and zero scored
        run: node scripts/audit_grade11_unit07_teacher_batch04_v182.cjs
      - name: Preserve V181 twelve private source review candidates and zero scored
        run: node scripts/audit_grade11_unit07_teacher_batch03_v181.cjs
      - name: Preserve V180 twelve private source review candidates and zero scored
        run: node scripts/audit_grade11_unit07_teacher_batch02_v180.cjs
      - name: Preserve V179 twelve private source review candidates and zero scored
        run: node scripts/audit_grade11_unit07_teacher_batch01_v179.cjs
      - name: Preserve V178 274 original source item inventory and score hold
        run: node scripts/audit_grade11_unit07_teacher_approval_index_v178.cjs
      - name: Preserve V177 original numerical source uncertainties
        run: node scripts/audit_grade11_unit07_numericals_v177.cjs
      - name: Preserve V176 comprehensive source controls
        run: node scripts/audit_grade11_unit07_comprehensive_v176.cjs
      - name: Preserve V175 short-response source controls
        run: node scripts/audit_grade11_unit07_short_v175.cjs
      - name: Preserve V174 textbook MCQ source controls
        run: node scripts/audit_grade11_unit07_exercise_mcq_v174.cjs
      - name: Preserve three owner original 80-question topic source registers
        run: |
          node scripts/audit_grade11_unit7_topic73_bank_v173.cjs
          node scripts/audit_grade11_unit7_topic72_bank_v168.cjs
          node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve 2250 Grade XI source-pinned existing original question identities
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve Unit6 560 individual teacher signoff HOLD
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve V160 and V161 staging/production teacher backend NO-GO
        run: |
          node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
          node scripts/audit_grade11_v161_staging_callable_contract.cjs
      - name: Preserve App Check and reporting launch locks
        run: |
          node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
          node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Upload counts only — never private questions or candidate revisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v188-unit7-private-two-item-identity-no-score
          path: qa-artifacts/grade11-v188-two-private-candidate-source-safe/summary.json
          if-no-files-found: warn
          retention-days: 14
