name: Grade XI V123 Unit 5 Two MCQ Sets and After-Practice Keys
on:
  pull_request:
    paths:
      - "portal/exam-quick-access.html"
      - "scripts/test_grade11_exam_quick_access_v101a.cjs"
      - "quality/grade11-v123-unit5-two-mini-sets-exam-quick-pathways.md"
      - ".github/workflows/validate-grade11-v123-unit5-mcq-mini-sets.yml"
  push:
    branches: [main]
    paths:
      - "portal/exam-quick-access.html"
      - "scripts/test_grade11_exam_quick_access_v101a.cjs"
      - "quality/grade11-v123-unit5-two-mini-sets-exam-quick-pathways.md"
      - ".github/workflows/validate-grade11-v123-unit5-mcq-mini-sets.yml"
  workflow_dispatch:
jobs:
  source-backed-unit5-revision-and-unchanged-exam-safeguards:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check adapted real-browser quick access regression
        run: node --check scripts/test_grade11_exam_quick_access_v101a.cjs
      - name: Preserve prior Unit 6 three unique provisional MCQ revision shortcuts
        run: node scripts/test_grade11_unit6_exam_quick_paths_v119.cjs
      - name: Preserve V122 Unit 5 descriptive worked-key public after-practice label
        run: node scripts/test_grade11_v122_unit5_public_after_practice_label.cjs
      - name: Preserve original V121 eight-public-resource visibility and source fingerprint inventory
        run: node scripts/test_grade11_v121_public_teacher_resources_audience_review.cjs
      - name: Preserve V118 six-unit exam readiness and source inventory
        run: node scripts/test_grade11_exam_readiness_v118.cjs
      - name: Preserve 560 pending Unit 6 approvals and official graded assessment gate
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve 2250 answer-free signed public question references
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Install pinned Chromium for three viewport navigation checks
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install chromium
      - name: Verify 47 source-backed direct links including Unit 5 Set A B and worked keys at 1280 390 320px
        run: node scripts/test_grade11_exam_quick_access_v101a.cjs
      - name: Upload synthetic browser snapshots and audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v123-unit5-two-mcq-set-direct-revision-links
          path: |
            qa-artifacts/grade11-exam-quick-access-v101a/
            qa-artifacts/grade11-v118-exam-readiness/
          if-no-files-found: warn
          retention-days: 10
