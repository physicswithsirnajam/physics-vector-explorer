name: Grade XI V142 Private Teacher Classroom Deny-By-Default Emulator
on:
  pull_request:
    paths:
      - "security-proposals/v142/teacher-classroom-isolated.rules"
      - "scripts/test_grade11_v142_classroom_private_rules_emulator.cjs"
      - "quality/grade11-v142-server-only-classroom-security-and-admin-provisioning-roadmap.md"
      - ".github/workflows/validate-grade11-v142-classroom-private-isolation.yml"
  push:
    branches: [main]
    paths:
      - "security-proposals/v142/teacher-classroom-isolated.rules"
      - "scripts/test_grade11_v142_classroom_private_rules_emulator.cjs"
      - "quality/grade11-v142-server-only-classroom-security-and-admin-provisioning-roadmap.md"
      - ".github/workflows/validate-grade11-v142-classroom-private-isolation.yml"
  workflow_dispatch:
jobs:
  original-private-policy-with-six-classroom-paths-deny-browser-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GCLOUD_PROJECT: demo-psn-v142-classroom
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax-check V142 owner-private-policy classroom isolation test
        run: node --check scripts/test_grade11_v142_classroom_private_rules_emulator.cjs
      - name: Preserve all 2250 Grade XI public original question identities
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve 560 pending individual Unit6 teacher decisions and exam hold
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve source-independent published-rules fingerprint comparison safeguards
        run: node scripts/test_grade11_published_rules_snapshot_v99t.cjs
      - name: Fail closed without the encrypted owner original 227-line rules
        env:
          PSN_FIRESTORE_BASELINE_RULES: ${{ secrets.PSN_FIRESTORE_BASELINE_RULES }}
        run: |
          if [ -z "$PSN_FIRESTORE_BASELINE_RULES" ]; then
            echo "::error::Owner private Firestore rules baseline is unavailable; no fallback, no Firebase deploy."
            exit 1
          fi
          echo "Encrypted owner rules baseline configured; exact fingerprint will be verified without printing rules."
      - name: Install pinned local-only Firestore Emulator dependencies
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase@13.4.0 @firebase/rules-unit-testing@6.0.0
          firebase-tools@15.37.0
      - name: Run 484 browser deny and original learner read controls in isolated and private full policies
        env:
          PSN_FIRESTORE_BASELINE_RULES: ${{ secrets.PSN_FIRESTORE_BASELINE_RULES }}
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99c/emulator-only.json
          --only firestore
          --project demo-psn-v142-classroom
          "node scripts/test_grade11_v142_classroom_private_rules_emulator.cjs"
      - name: Upload counts-only private rules simulation results (never owner rules text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v142-classroom-private-isolation-evidence
          path: qa-artifacts/grade11-v142-classroom-security/summary.json
          if-no-files-found: warn
          retention-days: 14
