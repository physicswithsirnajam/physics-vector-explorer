name: Grade XI V155 Unit7 Four-Item Teacher Pilot LOCAL Firebase Security
on:
  pull_request:
    paths:
      - "server/local-topic71-teacher-review-pilot-v155.cjs"
      - "scripts/test_grade11_v155_local_topic71_teacher_review.cjs"
      - "quality/grade11-v155-unit7-four-item-local-teacher-review-security-pilot.md"
      - ".github/workflows/validate-grade11-v155-unit7-teacher-pilot.yml"
  push:
    branches: [main]
    paths:
      - "server/local-topic71-teacher-review-pilot-v155.cjs"
      - "scripts/test_grade11_v155_local_topic71_teacher_review.cjs"
      - "quality/grade11-v155-unit7-four-item-local-teacher-review-security-pilot.md"
      - ".github/workflows/validate-grade11-v155-unit7-teacher-pilot.yml"
  workflow_dispatch:
jobs:
  local-emulator-teacher-advisory-only-no-answer-key-or-scored-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-psn-v143-classrooms
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax-check trusted review service and synthetic local integration
        run: |
          node --check server/local-topic71-teacher-review-pilot-v155.cjs
          node --check scripts/test_grade11_v155_local_topic71_teacher_review.cjs
      - name: Preserve all eighty keyless pending teacher review records
        run: node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve existing 2250 Grade XI provisional MCQ identities
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve Unit6 560 teacher-signoff HOLD
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve original private published-rules source attestation
        run: node scripts/test_grade11_published_rules_snapshot_v99t.cjs
      - name: Install pinned local Firebase SDKs and emulator tooling only
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase-admin@14.3.0 firebase@13.4.0
          @firebase/rules-unit-testing@6.0.0 firebase-tools@15.37.0
      - name: Exercise real LOCAL Auth + Firestore teacher review and all adversarial denials
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v143-classrooms
          "node scripts/test_grade11_v155_local_topic71_teacher_review.cjs"
      - name: Upload counts-only synthetic security evidence (no identities/keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v155-unit7-four-item-local-teacher-review-security
          path: qa-artifacts/grade11-v155-unit7-local-teacher-review/summary.json
          if-no-files-found: warn
          retention-days: 14
