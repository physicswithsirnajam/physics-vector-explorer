name: Validate Unit 6 Numerical Audit (V94-B3)
on:
  pull_request:
    paths:
      - "quality/grade11-unit06-v94b3-eleven-numerical-audit.md"
      - "scripts/test_grade11_unit06_numerical_audit_v94b3.cjs"
      - ".github/workflows/validate-grade11-unit06-numerical-v94b3.yml"
  push:
    branches: [main]
    paths:
      - "quality/grade11-unit06-v94b3-eleven-numerical-audit.md"
      - "scripts/test_grade11_unit06_numerical_audit_v94b3.cjs"
      - ".github/workflows/validate-grade11-unit06-numerical-v94b3.yml"
  workflow_dispatch:
jobs:
  numeric-source-arithmetic-and-qualifications:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check regression script syntax
        run: node --check scripts/test_grade11_unit06_numerical_audit_v94b3.cjs
      - name: Independently recalculate 11 original prepared numerical exercises
        run: node scripts/test_grade11_unit06_numerical_audit_v94b3.cjs
