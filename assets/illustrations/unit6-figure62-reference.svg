<svg role="img" aria-labelledby="fig62title fig62desc" viewBox="0 0 760 285" xmlns="http://www.w3.org/2000/svg">
<title id="fig62title">Upthrust due to pressure difference on a submerged cylinder</title>
<desc id="fig62desc">A cylinder with horizontal cross-sectional area A is submerged in liquid. Its top face is at depth h1 with pressure P1 and downward force F1 equals P1 A. Its bottom face is at greater depth h2 with pressure P2 and upward force F2 equals P2 A. The upward force exceeds the downward force.</desc>
