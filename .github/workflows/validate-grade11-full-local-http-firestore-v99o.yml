name: Grade XI Full Local HTTP-to-Firestore Review Trace (V99-O)
on:
  pull_request:
    paths:
      - "scripts/test_grade11_full_local_http_to_firestore_v99o.cjs"
      - "server/local-http-review-ingress-v99n.cjs"
      - "server/local-report-switch-v99m.cjs"
      - "server/offline-admin-appcheck-v99l.cjs"
      - "server/offline-review-request-gate-v99k.cjs"
      - "server/local-review-pipeline-v99j.cjs"
      - "server/verified-report-boundary-v99g.cjs"
      - "server/firebase-review-emulator-v99f.cjs"
      - "server/mcq-review-intake-v99e.cjs"
      - "server/pinned-approved-review-catalog-v99i.cjs"
      - "server/review-manifests/grade11-approved-public-review-refs-v99i.json"
      - "shared/mcq-review-contract-v99a.js"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-full-local-http-firestore-v99o.yml"
  push:
    branches: [main]
    paths:
      - "scripts/test_grade11_full_local_http_to_firestore_v99o.cjs"
      - "server/local-http-review-ingress-v99n.cjs"
      - "server/local-report-switch-v99m.cjs"
      - "server/offline-admin-appcheck-v99l.cjs"
      - "server/offline-review-request-gate-v99k.cjs"
      - "server/local-review-pipeline-v99j.cjs"
      - "server/verified-report-boundary-v99g.cjs"
      - "server/firebase-review-emulator-v99f.cjs"
      - "server/mcq-review-intake-v99e.cjs"
      - "server/pinned-approved-review-catalog-v99i.cjs"
      - "server/review-manifests/grade11-approved-public-review-refs-v99i.json"
      - "shared/mcq-review-contract-v99a.js"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-full-local-http-firestore-v99o.yml"
  workflow_dispatch:
jobs:
  real-local-http-auth-firestore-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GCLOUD_PROJECT: demo-psn-v99f-firestore
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      PSN_LOCAL_HTTP_REHEARSAL: enabled-local-test-only
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax-check local HTTP-to-Firestore tracing tests
        run: node --check scripts/test_grade11_full_local_http_to_firestore_v99o.cjs
      - name: Install pinned Firebase SDKs and local emulators, no service credentials
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase-admin@14.3.0 firebase@13.4.0 firebase-tools@15.37.0
      - name: Test full localhost HTTP to genuine local Auth and Firestore SDK transactions
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v99f-firestore
          "node scripts/test_grade11_full_local_http_to_firestore_v99o.cjs"
      - name: Archive only synthetic outcome labels, no tokens or student data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-full-local-http-firestore-v99o-evidence
          path: qa-artifacts/http-to-firestore-v99o/summary.json
          if-no-files-found: warn
          retention-days: 14
