name: Grade XI Local HTTP Administrator Audit History (V100-B)
on:
  pull_request:
    paths:
      - "server/local-http-admin-history-v100b.cjs"
      - "server/local-admin-audit-history-v99r.cjs"
      - "server/local-admin-review-transitions-v99q.cjs"
      - "server/local-admin-account-freshness-v99y.cjs"
      - "scripts/test_grade11_local_http_admin_history_v100b.cjs"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-local-http-admin-history-v100b.yml"
  push:
    branches: [main]
    paths:
      - "server/local-http-admin-history-v100b.cjs"
      - "server/local-admin-audit-history-v99r.cjs"
      - "server/local-admin-review-transitions-v99q.cjs"
      - "server/local-admin-account-freshness-v99y.cjs"
      - "scripts/test_grade11_local_http_admin_history_v100b.cjs"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-local-http-admin-history-v100b.yml"
  workflow_dispatch:
jobs:
  localhost-only-admin-audit-history-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-psn-v99f-firestore
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      PSN_LOCAL_ADMIN_HISTORY_HTTP: enabled-local-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax-check isolated HTTP audit history and emulator test
        run: |
          node --check server/local-http-admin-history-v100b.cjs
          node --check scripts/test_grade11_local_http_admin_history_v100b.cjs
      - name: Install pinned local Firebase SDKs and emulators (no production credentials)
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase-admin@14.3.0 firebase@13.4.0 firebase-tools@15.37.0
      - name: Verify real local HTTP audit lifecycle and rejected unauthorized requests
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v99f-firestore
          "node scripts/test_grade11_local_http_admin_history_v100b.cjs"
      - name: Archive synthetic summary only, never tokens or private records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-local-http-admin-history-v100b-evidence
          path: qa-artifacts/local-admin-history-v100b/summary.json
          if-no-files-found: warn
          retention-days: 14
