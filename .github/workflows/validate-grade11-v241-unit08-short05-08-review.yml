name: Grade XI V241 Unit 8 Original Short Questions 8.5-8.8 Review
on:
  pull_request:
    paths:
      - "quality/unit08/unit08-v241-short05-08-review-no-answers.json"
      - "quality/unit08/unit08-v241-short05-08-academic-triage.md"
      - "scripts/test_grade11_v241_unit08_short05_08_review.cjs"
      - ".github/workflows/validate-grade11-v241-unit08-short05-08-review.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit08/unit08-v241-short05-08-review-no-answers.json"
      - "quality/unit08/unit08-v241-short05-08-academic-triage.md"
      - "scripts/test_grade11_v241_unit08_short05_08_review.cjs"
      - ".github/workflows/validate-grade11-v241-unit08-short05-08-review.yml"
jobs:
  original-short-questions-source-review-without-student-answers:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate review-only JSON and test syntax
        run: |
          node --check scripts/test_grade11_v241_unit08_short05_08_review.cjs
          node -e "JSON.parse(require('fs').readFileSync('quality/unit08/unit08-v241-short05-08-review-no-answers.json','utf8'))"
      - name: V241 original source Q8.5-8.8 and thermodynamic model plus SLO checks
        run: node scripts/test_grade11_v241_unit08_short05_08_review.cjs
      - name: Preserve V240 original short Q8.1-8.4 teacher review
        run: node scripts/test_grade11_v240_unit08_short01_04_review.cjs
      - name: Preserve V239 original end MCQs13-18 review
        run: node scripts/test_grade11_v239_unit08_end_mcq13_18_review.cjs
      - name: Preserve V238 original end MCQs7-12 review
        run: node scripts/test_grade11_v238_unit08_end_mcq07_12_review.cjs
      - name: Preserve V237 original end MCQs1-6 review
        run: node scripts/test_grade11_v237_unit08_end_mcq01_06_review.cjs
      - name: Preserve V235 NBF original 50-exercise source inventory
        run: node scripts/test_grade11_v235_unit08_exercise_inventory.cjs
      - name: Preserve V224 original textbook and FBISE summative framework
        run: node scripts/test_grade11_v224_unit8_original_source_slo_manifest.cjs
      - name: Preserve all pinned 2250 Unit1-6 MCQ IDs options and keys
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
