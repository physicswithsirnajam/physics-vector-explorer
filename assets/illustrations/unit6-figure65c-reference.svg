<g stroke="#cfdae4" stroke-width="1" stroke-dasharray="4 6"><path d="M78 79H675"/><path d="M78 237H675"/></g>
<g stroke="#9aaec1" stroke-width="1.2"><path d="M77 79H70 M77 268H70 M78 264V273 M238 264V273 M413 264V273 M456 264V273 M637 264V273"/></g>
