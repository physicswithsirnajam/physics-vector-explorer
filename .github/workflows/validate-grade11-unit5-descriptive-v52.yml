name: Validate Grade XI Unit 5 Descriptive and Numerical Practice (V52)
on:
  pull_request:
    paths:
      - "portal/unit-05*"
      - "portal/learning-catalog.json"
      - "question-bank/grade-11/unit-05*"
      - "scripts/test_unit05_*.cjs"
      - "quality/grade11-unit05-descriptive-v52.md"
      - ".github/workflows/validate-grade11-unit5-descriptive-v52.yml"
  push:
    branches: [main]
    paths:
      - "portal/unit-05*"
      - "portal/learning-catalog.json"
      - "question-bank/grade-11/unit-05*"
      - "scripts/test_unit05_*.cjs"
      - "quality/grade11-unit05-descriptive-v52.md"
      - ".github/workflows/validate-grade11-unit5-descriptive-v52.yml"
  workflow_dispatch:

jobs:
  unit5-descriptive-source-and-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and source data verification
        run: |
          node --check portal/unit-05-descriptive-student.js
          node --check portal/unit-05-descriptive-teacher.js
          node --check scripts/test_unit05_descriptive_v52.cjs
          node -e "const s=require('./question-bank/grade-11/unit-05-v52-descriptive-student.json');const k=require('./question-bank/grade-11/unit-05-v52-descriptive-teacher-key.json');if(s.sectionB.length!==7||s.sectionC.length!==2||k.answers.length!==18||s.pattern.totalMarks!==40)process.exit(1)"
      - name: Install pinned Playwright Chromium for CI only
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Independent numerical science, rubric and actual browser verification
        run: node scripts/test_unit05_descriptive_v52.cjs
      - name: Preserve Set B separate MCQs and worked key
        run: node scripts/test_unit05_mcq_set_b_v51.cjs
      - name: Preserve Set A separate MCQs and worked key
        run: node scripts/test_unit05_mcq_v50.cjs
      - name: Preserve official Unit 5 SLO academic verification
        run: node scripts/test_unit05_fbise_audit_v49.cjs
      - name: Preserve work-energy numerical interactive
        run: node scripts/test_unit05_work_energy_v48.cjs
      - name: Upload student/teacher screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit05-v52-descriptive-student-teacher-browser-previews
          path: qa-artifacts/unit05-v52/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve Unit 4 physics source and academic regressions
        run: |
          node scripts/test_unit04_rotational_foundations.cjs
          node scripts/test_unit04_centripetal_part2.cjs
          node scripts/test_unit04_weightlessness_part3.cjs
          node scripts/test_unit04_angular_momentum_part4.cjs
          node scripts/test_unit04_centrifuge_audit.cjs
          node scripts/test_unit04_mcq_v39.cjs
          node scripts/test_unit04_qc_v40.cjs
          node scripts/test_unit04_descriptive_v41.cjs
          node scripts/test_unit04_assessment_pack_v42.cjs
