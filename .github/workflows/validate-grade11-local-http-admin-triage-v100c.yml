name: Grade XI Local HTTP Admin Review Transitions (V100-C)
on:
  pull_request:
    paths:
      - "server/local-http-admin-triage-v100c.cjs"
      - "server/local-admin-review-transitions-v99q.cjs"
      - "server/local-admin-account-freshness-v99y.cjs"
      - "scripts/test_grade11_local_http_admin_triage_v100c.cjs"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-local-http-admin-triage-v100c.yml"
  push:
    branches: [main]
    paths:
      - "server/local-http-admin-triage-v100c.cjs"
      - "server/local-admin-review-transitions-v99q.cjs"
      - "server/local-admin-account-freshness-v99y.cjs"
      - "scripts/test_grade11_local_http_admin_triage_v100c.cjs"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-local-http-admin-triage-v100c.yml"
  workflow_dispatch:
jobs:
  localhost-only-admin-review-transition-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-psn-v99f-firestore
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      PSN_LOCAL_ADMIN_TRIAGE_HTTP: enabled-local-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax-check strictly local POST and emulator security tests
        run: |
          node --check server/local-http-admin-triage-v100c.cjs
          node --check scripts/test_grade11_local_http_admin_triage_v100c.cjs
      - name: Install pinned demo-only Firebase SDKs and emulators
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase-admin@14.3.0 firebase@13.4.0 firebase-tools@15.37.0
      - name: Prove owner-only, audited local HTTP MCQ review transitions
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v99f-firestore
          "node scripts/test_grade11_local_http_admin_triage_v100c.cjs"
      - name: Preserve only synthetic test summary, never private records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-local-http-admin-triage-v100c-summary
          path: qa-artifacts/local-admin-triage-v100c/summary.json
          if-no-files-found: warn
          retention-days: 14
