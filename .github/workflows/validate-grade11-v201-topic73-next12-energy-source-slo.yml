name: Grade XI V201 Unit7.3 Next Twelve Original Energy/SLO QC (NO SCORE)
on:
  pull_request:
    paths:
      - "quality/unit07/unit07-v201-topic73-next12-energy-source-slo-no-keys.json"
      - "quality/grade11-v201-unit07-topic73-second12-energy-source-slo-qc.md"
      - "scripts/audit_grade11_unit07_topic73_next12_v201.cjs"
      - "scripts/test_grade11_unit07_topic73_energy_math_v201.cjs"
      - ".github/workflows/validate-grade11-v201-topic73-next12-energy-source-slo.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/unit07-v201-topic73-next12-energy-source-slo-no-keys.json"
      - "quality/grade11-v201-unit07-topic73-second12-energy-source-slo-qc.md"
      - "scripts/audit_grade11_unit07_topic73_next12_v201.cjs"
      - "scripts/test_grade11_unit07_topic73_energy_math_v201.cjs"
      - ".github/workflows/validate-grade11-v201-topic73-next12-energy-source-slo.yml"
  workflow_dispatch:
jobs:
  validate-source-bound-twelve-and-academic-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check V201 source, science and math tests
        run: |
          node --check scripts/audit_grade11_unit07_topic73_next12_v201.cjs
          node --check scripts/test_grade11_unit07_topic73_energy_math_v201.cjs
      - name: Verify exact V173 source SHA, no duplicate with V185 or V197 and teacher HOLD
        run: node scripts/audit_grade11_unit07_topic73_next12_v201.cjs
      - name: Recompute synthetic elastic energy, dimensional and source-axes invariants
        run: node scripts/test_grade11_unit07_topic73_energy_math_v201.cjs
      - name: Preserve V200 twelve Topic7.1 original structural comparison source IDs
        run: node scripts/audit_grade11_unit07_topic71_next12_v200.cjs
      - name: Preserve V199 earlier Topic7.1 twelve original source IDs and B22
        run: node scripts/audit_grade11_unit07_topic71_secondpass_v199.cjs
      - name: Preserve V198 Topic7.2 source register and stress-strain math
        run: |
          node scripts/audit_grade11_unit07_topic72_secondpass_v198.cjs
          node scripts/test_grade11_unit07_topic72_math_v198.cjs
      - name: Preserve V197 first twelve original Topic7.3 source IDs and physics
        run: |
          node scripts/audit_grade11_unit07_topic73_secondpass_v197.cjs
          node scripts/test_grade11_unit07_topic73_math_v197.cjs
      - name: Preserve V173 all eighty original Topic7.3 and earlier two topic banks
        run: |
          node scripts/audit_grade11_unit7_topic73_bank_v173.cjs
          node scripts/audit_grade11_unit7_topic72_bank_v168.cjs
          node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve V196 source SI scaling and nonlinear graph safeguards
        run: node scripts/test_grade11_unit07_numerical_scaling_v196.cjs
      - name: Preserve V195 unsigned human decisions and primary textbook mathematical checks
        run: |
          node scripts/audit_grade11_unit07_teacher_decision_pack_v195.cjs
          node scripts/audit_grade11_unit07_teacher_solution_qc_v194.cjs
          node scripts/audit_grade11_unit07_original_pdf_source_v193.cjs
      - name: Preserve V192 exact Q25 scientific HOLD and V191/V190 mock review denials
        run: |
          node scripts/audit_grade11_unit07_q25_disposition_v192.cjs
          node scripts/test_grade11_unit07_offline_review_evidence_v191.cjs
          node scripts/test_grade11_unit07_revision_bound_review_v190.cjs
      - name: Preserve original V185 72 candidate teacher holds and 274-source inventory
        run: |
          node scripts/audit_grade11_unit07_teacher_readiness_v185.cjs
          node scripts/audit_grade11_unit07_teacher_approval_index_v178.cjs
      - name: Preserve Grade XI pinned 2250 original source identities and Unit6 560 academic holds
        run: |
          node scripts/test_grade11_pinned_review_catalog_v99i.cjs
          node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve teacher backend production and staging NO-GO
        run: |
          node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
          node scripts/audit_grade11_v161_staging_callable_contract.cjs
      - name: Preserve App Check browser and report launch release restrictions
        run: |
          node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
          node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Upload keyless, counts-only audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v201-topic73-next12-original-source-no-score
          path: qa-artifacts/grade11-v201-topic73-next12-original-qc/summary.json
          if-no-files-found: warn
          retention-days: 14
