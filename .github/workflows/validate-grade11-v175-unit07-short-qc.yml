name: Grade XI V175 Unit7 Original Short Questions 7.1-7.11 Science/SLO Review (HOLD)
on:
  pull_request:
    paths:
      - "quality/unit07/unit07-v175-end-exercise-short01-11-image-bound-no-answers.json"
      - "quality/grade11-v175-unit07-textbook-short01-11-science-slo-qc.md"
      - "scripts/audit_grade11_unit07_short_v175.cjs"
      - ".github/workflows/validate-grade11-v175-unit07-short-qc.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/unit07-v175-end-exercise-short01-11-image-bound-no-answers.json"
      - "quality/grade11-v175-unit07-textbook-short01-11-science-slo-qc.md"
      - "scripts/audit_grade11_unit07_short_v175.cjs"
      - ".github/workflows/validate-grade11-v175-unit07-short-qc.yml"
  workflow_dispatch:
jobs:
  verify-original-short11-source-science-academic-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check NBF 11-original-short source and science audit
        run: node --check scripts/audit_grade11_unit07_short_v175.cjs
      - name: Check 11 source-region hashes, 5 compulsory/5 optional decisions and 23 release-denial mutations
        run: node scripts/audit_grade11_unit07_short_v175.cjs
      - name: Preserve V174 original textbook 10-MCQ review and scored HOLD
        run: node scripts/audit_grade11_unit07_exercise_mcq_v174.cjs
      - name: Preserve V173 original Topic7.3 80 question academic HOLD
        run: node scripts/audit_grade11_unit7_topic73_bank_v173.cjs
      - name: Preserve V168 original Topic7.2 80 question academic HOLD
        run: node scripts/audit_grade11_unit7_topic72_bank_v168.cjs
      - name: Preserve V154 original Topic7.1 80 pending teacher science/cognitive signoffs
        run: node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve 2250 existing Grade XI provisional MCQ source identities
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve original Unit6 560 teacher pending release gates
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve teacher backend staging/production deployment NO-GO
        run: |
          node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
          node scripts/audit_grade11_v161_staging_callable_contract.cjs
      - name: Preserve App Check browser and reporting launch lock
        run: |
          node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
          node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Upload safe counts-only teacher review QA; never source images or answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v175-unit7-textbook-original-short11-keyless-qc
          path: qa-artifacts/grade11-v175-unit7-textbook-short11/summary.json
          if-no-files-found: warn
          retention-days: 14
