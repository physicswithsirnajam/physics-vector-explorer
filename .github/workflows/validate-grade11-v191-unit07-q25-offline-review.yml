name: Grade XI V191 Unit7 Q25 Private Offline Teacher Review Evidence (NO SCORE)
on:
  pull_request:
    paths:
      - "scripts/unit07_offline_review_evidence_v191.cjs"
      - "scripts/test_grade11_unit07_offline_review_evidence_v191.cjs"
      - "quality/unit07/unit07-v191-q25-private-review-readiness-no-keys.json"
      - "quality/grade11-v191-unit07-q25-owner-teacher-offline-review-qc.md"
      - ".github/workflows/validate-grade11-v191-unit07-q25-offline-review.yml"
  push:
    branches: [main]
    paths:
      - "scripts/unit07_offline_review_evidence_v191.cjs"
      - "scripts/test_grade11_unit07_offline_review_evidence_v191.cjs"
      - "quality/unit07/unit07-v191-q25-private-review-readiness-no-keys.json"
      - "quality/grade11-v191-unit07-q25-owner-teacher-offline-review-qc.md"
      - ".github/workflows/validate-grade11-v191-unit07-q25-offline-review.yml"
  workflow_dispatch:
jobs:
  verify-untrusted-offline-evidence-never-becomes-score:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check V191 local evidence receipt and synthetic no-score tests
        run: |
          node --check scripts/unit07_offline_review_evidence_v191.cjs
          node --check scripts/test_grade11_unit07_offline_review_evidence_v191.cjs
      - name: Verify offline Q25 evidence notes never become teacher approvals or scored questions
        run: node scripts/test_grade11_unit07_offline_review_evidence_v191.cjs
      - name: Preserve V190 synthetic revision-bound role, stale revision and no-score controls
        run: node scripts/test_grade11_unit07_revision_bound_review_v190.cjs
      - name: Preserve V189 original two academic SLO/distractor findings
        run: node scripts/audit_grade11_unit07_two_candidate_review_v189.cjs
      - name: Preserve V188 first two private source-bound candidate checks
        run: node scripts/audit_grade11_unit07_private_pilot_v188.cjs
      - name: Preserve V187 local private manifest safety
        run: node scripts/test_grade11_unit07_private_manifest_v187.cjs
      - name: Preserve V186 synthetic immutable revision and revocation
        run: node scripts/test_grade11_unit07_offline_protocol_v186.cjs
      - name: Preserve V185 72 candidate approval readiness HOLD
        run: node scripts/audit_grade11_unit07_teacher_readiness_v185.cjs
      - name: Preserve V184 to V179 original private teacher batches
        run: |
          node scripts/audit_grade11_unit07_teacher_batch06_v184.cjs
          node scripts/audit_grade11_unit07_teacher_batch05_v183.cjs
          node scripts/audit_grade11_unit07_teacher_batch04_v182.cjs
          node scripts/audit_grade11_unit07_teacher_batch03_v181.cjs
          node scripts/audit_grade11_unit07_teacher_batch02_v180.cjs
          node scripts/audit_grade11_unit07_teacher_batch01_v179.cjs
      - name: Preserve V178 source 274 and prior NBF question academic holds
        run: |
          node scripts/audit_grade11_unit07_teacher_approval_index_v178.cjs
          node scripts/audit_grade11_unit07_numericals_v177.cjs
          node scripts/audit_grade11_unit07_comprehensive_v176.cjs
          node scripts/audit_grade11_unit07_short_v175.cjs
          node scripts/audit_grade11_unit07_exercise_mcq_v174.cjs
      - name: Preserve three original owner topic MCQ bank fingerprints
        run: |
          node scripts/audit_grade11_unit7_topic73_bank_v173.cjs
          node scripts/audit_grade11_unit7_topic72_bank_v168.cjs
          node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve existing 2250 Grade XI original source-pinned MCQ identities
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve Unit6 560 individual teacher signoff HOLD
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve staging and production teacher backend NO-GO
        run: |
          node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
          node scripts/audit_grade11_v161_staging_callable_contract.cjs
      - name: Preserve App Check and reporting launch lock
        run: |
          node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
          node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Upload counts-only QA, never private keyed question text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v191-unit7-q25-offline-review-no-scoring
          path: qa-artifacts/grade11-v191-q25-offline-teacher-review/summary.json
          if-no-files-found: warn
          retention-days: 14
