name: Grade XI V219 Unit 7 Unapproved MCQ Revision Candidates
on:
  pull_request:
    paths:
      - "quality/unit07/unit07-v219-three-original-ambiguities-four-draft-mcqs-no-keys.json"
      - "quality/grade11-v219-unit07-original-mcq3-5-10-revision-proposals.md"
      - "scripts/test_grade11_v219_mcq_source_revision_candidates.cjs"
      - ".github/workflows/validate-grade11-v219-original-mcq-candidates.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/unit07-v219-three-original-ambiguities-four-draft-mcqs-no-keys.json"
      - "scripts/test_grade11_v219_mcq_source_revision_candidates.cjs"
      - ".github/workflows/validate-grade11-v219-original-mcq-candidates.yml"
jobs:
  source-immutable-four-candidate-science-and-unscored-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify JSON and source QC script syntax
        run: |
          node --check scripts/test_grade11_v219_mcq_source_revision_candidates.cjs
          node -e "JSON.parse(require('fs').readFileSync('quality/unit07/unit07-v219-three-original-ambiguities-four-draft-mcqs-no-keys.json','utf8'))"
      - name: Verify no original textbook data/keys overwritten, scientific numerics and source scope
        run: node scripts/test_grade11_v219_mcq_source_revision_candidates.cjs
      - name: Preserve currently published 2250 source MCQ identities and keys
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve V218 original Unit 7 34-exercise worklist identities (read-only source audit)
        run: |
          node --check scripts/test_grade11_v218_unit7_exercise_teacher_worklist.cjs
          node scripts/audit_grade11_unit07_exercise_mcq_v174.cjs
          node scripts/audit_grade11_unit07_teacher_approval_index_v178.cjs
