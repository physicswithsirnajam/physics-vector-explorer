name: Grade XI Unit 6 V111 Approved Safe Practice Overlay
on:
  pull_request:
    paths:
      - "shared/practice-bank-adapter-v55.js"
      - "question-bank/grade-11/unit-06-topic64-v111-approved-practice-overlay.json"
      - "portal/unit-06-topic-64-preview.*"
      - "portal/unit-06-balanced-mcq-v95c1.*"
      - "practice-engine/index.html"
      - "build-your-physics-test.html"
      - "scripts/test_grade11_u06_v111_approved_practice_overlay.cjs"
      - "scripts/test_grade11_unit06_central_v*.cjs"
      - "scripts/test_grade11_unit06_v95c1_balanced_assessment.cjs"
      - ".github/workflows/validate-grade11-unit6-v111-approved-practice-overlay.yml"
  push:
    branches: [main]
    paths:
      - "shared/practice-bank-adapter-v55.js"
      - "question-bank/grade-11/unit-06-topic64-v111-approved-practice-overlay.json"
      - "portal/unit-06-topic-64-preview.*"
      - "portal/unit-06-balanced-mcq-v95c1.*"
      - "practice-engine/index.html"
      - "build-your-physics-test.html"
      - "scripts/test_grade11_u06_v111_approved_practice_overlay.cjs"
      - "scripts/test_grade11_unit06_central_v*.cjs"
      - "scripts/test_grade11_unit06_v95c1_balanced_assessment.cjs"
      - ".github/workflows/validate-grade11-unit6-v111-approved-practice-overlay.yml"
  workflow_dispatch:
jobs:
  source-and-browser-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check V111 syntax
        run: |
          node --check scripts/test_grade11_u06_v111_approved_practice_overlay.cjs
          node --check shared/practice-bank-adapter-v55.js
          node --check portal/unit-06-topic-64-preview.js
          node --check portal/unit-06-balanced-mcq-v95c1.js
      - name: Install pinned Chromium browser test dependency
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify source immutability, exact variants, mobile/projection, central pool, blocked originals and fail-closed controls
        run: node scripts/test_grade11_u06_v111_approved_practice_overlay.cjs
      - name: Regress topic 6.4 source archive and preview (V82)
        run: node scripts/test_unit06_topic64_v82.cjs
      - name: Regress central Grade XI Unit 6 integration and original provenance
        run: |
          node scripts/test_grade11_unit06_central_v79.cjs
          node scripts/test_grade11_unit06_central_v81.cjs
          node scripts/test_grade11_unit06_central_v83.cjs
          node scripts/test_grade11_unit06_central_v85.cjs
          node scripts/test_grade11_unit06_central_v87.cjs
          node scripts/test_grade11_unit06_central_v89.cjs
      - name: Regress seven-topic balanced provisional browser quiz (V95-C1)
        run: node scripts/test_grade11_unit06_v95c1_balanced_assessment.cjs
      - name: Regress 560 pending approvals and first-four teacher evidence (V109/V110)
        run: |
          node scripts/test_grade11_unit6_v109_first_four_teacher_decisions.cjs
          node scripts/test_grade11_unit6_v110_full_candidate_items.cjs
      - name: Retain previous navigation and exam readiness safeguards (V103/V106)
        run: |
          node scripts/test_grade11_textbook_finder_v103.cjs
          node scripts/test_grade11_slo_study_finder_v106.cjs
      - name: Upload synthetic screenshots and integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-u06-v111-practice-approval-safety
          path: |
            qa-artifacts/unit6-v111-practice-overlay/
            qa-artifacts/unit06-topic64-v82/
          retention-days: 10
          if-no-files-found: warn
