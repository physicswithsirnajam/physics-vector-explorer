name: Validate Grade XI Unit 6 Topic 6.7 Superfluidity Study (V95-B7)
on:
  pull_request:
    paths:
      - "portal/unit-06-topic-67-study-v95b7.html"
      - "portal/unit-06-topic-67-study-v95b7.js"
      - "portal/unit-06-learning-desk-v95a.html"
      - "assets/illustrations/unit6-v95b7-superfluid-film-original.svg"
      - "assets/illustrations/unit6-v95b7-vortex-onset-original.svg"
      - "assets/illustrations/unit6-v95b7-phase-axes-guide-original.svg"
      - "quality/grade11-unit06-v95b7-topic67-student-lesson-source-and-signoff.md"
      - "scripts/test_grade11_unit06_v95b7_topic67_study.cjs"
      - ".github/workflows/validate-grade11-unit06-topic67-study-v95b7.yml"
  push:
    branches: [main]
    paths:
      - "portal/unit-06-topic-67-study-v95b7.html"
      - "portal/unit-06-topic-67-study-v95b7.js"
      - "portal/unit-06-learning-desk-v95a.html"
      - "assets/illustrations/unit6-v95b7-superfluid-film-original.svg"
      - "assets/illustrations/unit6-v95b7-vortex-onset-original.svg"
      - "assets/illustrations/unit6-v95b7-phase-axes-guide-original.svg"
      - "quality/grade11-unit06-v95b7-topic67-student-lesson-source-and-signoff.md"
      - "scripts/test_grade11_unit06_v95b7_topic67_study.cjs"
      - ".github/workflows/validate-grade11-unit06-topic67-study-v95b7.yml"
  workflow_dispatch:
jobs:
  superfluidity-b43-source-rights-and-mobile:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify B43 curriculum, original-art rights, model limits and all seven linked lessons
        run: |
          node --check portal/unit-06-topic-67-study-v95b7.js
          node --check scripts/test_grade11_unit06_v95b7_topic67_study.cjs
          node scripts/test_grade11_unit06_v95b7_topic67_study.cjs
          node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
          node scripts/test_grade11_unit06_v95a_learning_desk.cjs
          node scripts/test_grade11_unit06_v95b1_topic61_study.cjs
          node scripts/test_grade11_unit06_v95b2_topic62_study.cjs
          node scripts/test_grade11_unit06_v95b3_topic63_study.cjs
          node scripts/test_grade11_unit06_v95b4_topic64_study.cjs
          node scripts/test_grade11_unit06_v95b5_topic65_study.cjs
          node scripts/test_grade11_unit06_v95b6_topic66_study.cjs
      - name: Install Chromium for 390px mobile, 768px tablet and 1440px projector
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify source-safe graphics, concept chooser, temperature conversions, inputs and responsive layout
        run: node scripts/test_grade11_unit06_v95b7_topic67_study.cjs --browser
