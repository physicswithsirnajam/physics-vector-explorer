name: Grade XI V246 Unit 8 Original Numericals 8.1-8.3 Academic Review
on:
  pull_request:
    paths:
      - "quality/unit08/unit08-v246-numerical01-03-source-qc-no-approved-answers.json"
      - "quality/unit08/unit08-v246-numerical01-03-teacher-triage.md"
      - "scripts/test_grade11_v246_unit08_numerical01_03_review.cjs"
      - ".github/workflows/validate-grade11-v246-unit08-numerical01-03-review.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit08/unit08-v246-numerical01-03-source-qc-no-approved-answers.json"
      - "quality/unit08/unit08-v246-numerical01-03-teacher-triage.md"
      - "scripts/test_grade11_v246_unit08_numerical01_03_review.cjs"
      - ".github/workflows/validate-grade11-v246-unit08-numerical01-03-review.yml"
jobs:
  original-source-conditional-calculations-no-student-answer-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check original numerical review metadata and JavaScript syntax
        run: |
          node --check scripts/test_grade11_v246_unit08_numerical01_03_review.cjs
          node -e "JSON.parse(require('fs').readFileSync('quality/unit08/unit08-v246-numerical01-03-source-qc-no-approved-answers.json','utf8'))"
      - name: V246 recalculate original NBF numerical 8.1-8.3 and detect source underdetermination
        run: node scripts/test_grade11_v246_unit08_numerical01_03_review.cjs
      - name: Preserve V245 original comprehensive 8.9-8.11 and entropy contradictions
        run: node scripts/test_grade11_v245_unit08_comprehensive09_11_review.cjs
      - name: Preserve V244 original comprehensive 8.5-8.7 review
        run: node scripts/test_grade11_v244_unit08_comprehensive05_07_review.cjs
      - name: Preserve V243 original comprehensive 8.1-8.4 review
        run: node scripts/test_grade11_v243_unit08_comprehensive01_04_review.cjs
      - name: Preserve V242 original short Q8.9-8.13 review
        run: node scripts/test_grade11_v242_unit08_short09_13_review.cjs
      - name: Preserve V241 original short Q8.5-8.8 review
        run: node scripts/test_grade11_v241_unit08_short05_08_review.cjs
      - name: Preserve V240 original short Q8.1-8.4 review
        run: node scripts/test_grade11_v240_unit08_short01_04_review.cjs
      - name: Preserve V239 original last six MCQ review
        run: node scripts/test_grade11_v239_unit08_end_mcq13_18_review.cjs
      - name: Preserve V238 original middle six MCQ review
        run: node scripts/test_grade11_v238_unit08_end_mcq07_12_review.cjs
      - name: Preserve V237 original first six MCQ review
        run: node scripts/test_grade11_v237_unit08_end_mcq01_06_review.cjs
      - name: Preserve V235 original 50-item exercise and 9 numerical source inventory
        run: node scripts/test_grade11_v235_unit08_exercise_inventory.cjs
      - name: Preserve V224 original NBF source and official FBISE summative framework
        run: node scripts/test_grade11_v224_unit8_original_source_slo_manifest.cjs
      - name: Preserve exact 2250 pinned Units1-6 MCQ IDs options and keys
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
