name: Grade XI V190 Unit7 Synthetic Revision-Bound Teacher Decisions (NO DEPLOY)
on:
  pull_request:
    paths:
      - "scripts/unit07_revision_bound_review_v190.cjs"
      - "scripts/test_grade11_unit07_revision_bound_review_v190.cjs"
      - "quality/unit07/unit07-v190-offline-decision-contract-no-deploy.json"
      - "quality/grade11-v190-unit07-offline-revision-bound-decision-qc.md"
      - ".github/workflows/validate-grade11-v190-unit07-revision-bound-decision.yml"
  push:
    branches: [main]
    paths:
      - "scripts/unit07_revision_bound_review_v190.cjs"
      - "scripts/test_grade11_unit07_revision_bound_review_v190.cjs"
      - "quality/unit07/unit07-v190-offline-decision-contract-no-deploy.json"
      - "quality/grade11-v190-unit07-offline-revision-bound-decision-qc.md"
      - ".github/workflows/validate-grade11-v190-unit07-revision-bound-decision.yml"
  workflow_dispatch:
jobs:
  validate-revision-bound-synthetic-approval-and-student-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check synthetic role and revision protocol
        run: |
          node --check scripts/unit07_revision_bound_review_v190.cjs
          node --check scripts/test_grade11_unit07_revision_bound_review_v190.cjs
      - name: Verify stale-revision denials, mock reviewer revocations, Q22 supporting-only and score HOLD
        run: node scripts/test_grade11_unit07_revision_bound_review_v190.cjs
      - name: Preserve V189 two private candidates physics/SLO boundaries and no-score
        run: node scripts/audit_grade11_unit07_two_candidate_review_v189.cjs
      - name: Preserve V188 private two-source revision pilot, no-score
        run: node scripts/audit_grade11_unit07_private_pilot_v188.cjs
      - name: Preserve V187 private candidate manifest intake path protections
        run: node scripts/test_grade11_unit07_private_manifest_v187.cjs
      - name: Preserve V186 synthetic revision and revocation baseline
        run: node scripts/test_grade11_unit07_offline_protocol_v186.cjs
      - name: Preserve V185 72 private-candidate source identities and pending decisions
        run: node scripts/audit_grade11_unit07_teacher_readiness_v185.cjs
      - name: Preserve V184 twelve private candidate reviews
        run: node scripts/audit_grade11_unit07_teacher_batch06_v184.cjs
      - name: Preserve V183 twelve private candidate reviews
        run: node scripts/audit_grade11_unit07_teacher_batch05_v183.cjs
      - name: Preserve V182 twelve private candidate reviews
        run: node scripts/audit_grade11_unit07_teacher_batch04_v182.cjs
      - name: Preserve V181 twelve private candidate reviews
        run: node scripts/audit_grade11_unit07_teacher_batch03_v181.cjs
      - name: Preserve V180 twelve private candidate reviews
        run: node scripts/audit_grade11_unit07_teacher_batch02_v180.cjs
      - name: Preserve V179 twelve private candidate reviews
        run: node scripts/audit_grade11_unit07_teacher_batch01_v179.cjs
      - name: Preserve V178 original 274 Unit7 source inventory and scored HOLD
        run: node scripts/audit_grade11_unit07_teacher_approval_index_v178.cjs
      - name: Preserve V177–V174 NBF textbook exercise QC
        run: |
          node scripts/audit_grade11_unit07_numericals_v177.cjs
          node scripts/audit_grade11_unit07_comprehensive_v176.cjs
          node scripts/audit_grade11_unit07_short_v175.cjs
          node scripts/audit_grade11_unit07_exercise_mcq_v174.cjs
      - name: Preserve original 240 owner Topic7 source MCQ fingerprints
        run: |
          node scripts/audit_grade11_unit7_topic73_bank_v173.cjs
          node scripts/audit_grade11_unit7_topic72_bank_v168.cjs
          node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve existing original Grade XI 2250 pinned MCQ identities
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve Unit6 560 item-level teacher release HOLD
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve production/staging teacher backend NO-GO
        run: |
          node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
          node scripts/audit_grade11_v161_staging_callable_contract.cjs
      - name: Preserve App Check browser entrypoints and reporting locks
        run: |
          node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
          node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Upload counts-only proof (never original/revised private keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v190-unit7-synthetic-revision-bound-no-score
          path: qa-artifacts/grade11-v190-revision-bound-decision-synthetic/summary.json
          if-no-files-found: warn
          retention-days: 14
