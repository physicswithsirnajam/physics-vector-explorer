name: Grade XI Fresh Admin Authority Before Private Review (V99-Y)
on:
  pull_request:
    paths:
      - "server/local-admin-account-freshness-v99y.cjs"
      - "server/local-admin-review-reader-v99p.cjs"
      - "server/local-admin-review-transitions-v99q.cjs"
      - "server/local-admin-audit-history-v99r.cjs"
      - "scripts/test_grade11_admin_account_freshness_v99y.cjs"
      - ".github/workflows/validate-grade11-admin-account-freshness-v99y.yml"
      - "security-proposals/v99j/combined-local-emulators.json"
  push:
    branches: [main]
    paths:
      - "server/local-admin-account-freshness-v99y.cjs"
      - "server/local-admin-review-reader-v99p.cjs"
      - "server/local-admin-review-transitions-v99q.cjs"
      - "server/local-admin-audit-history-v99r.cjs"
      - "scripts/test_grade11_admin_account_freshness_v99y.cjs"
      - ".github/workflows/validate-grade11-admin-account-freshness-v99y.yml"
  workflow_dispatch:
jobs:
  live-emulator-admin-account-freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-psn-v99f-firestore
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax check all fresh-admin local authorization code
        run: |
          node --check server/local-admin-account-freshness-v99y.cjs
          node --check server/local-admin-review-reader-v99p.cjs
          node --check server/local-admin-review-transitions-v99q.cjs
          node --check server/local-admin-audit-history-v99r.cjs
          node --check scripts/test_grade11_admin_account_freshness_v99y.cjs
      - name: Install pinned Firebase SDKs and isolated local emulators
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase-admin@14.3.0 firebase@13.4.0
          @firebase/rules-unit-testing@6.0.0 firebase-tools@15.37.0
      - name: Test current role revocation, unverified and disabled admins with stale real emulator JWT
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v99f-firestore
          "node scripts/test_grade11_admin_account_freshness_v99y.cjs"
      - name: Upload aggregate synthetic permission evidence only (never real tokens or UIDs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-admin-fresh-permissions-v99y-evidence
          path: qa-artifacts/admin-freshness-v99y/summary.json
          if-no-files-found: warn
          retention-days: 14
