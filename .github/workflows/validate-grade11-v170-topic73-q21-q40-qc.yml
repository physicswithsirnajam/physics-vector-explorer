name: Grade XI V170 Unit7.3 Original Q21–40 Science/SLO Review (HOLD)
on:
  pull_request:
    paths:
      - "quality/unit07/topic73-v170-q21-q40-source-bound-academic-review-no-keys.json"
      - "quality/grade11-v170-topic73-q21-q40-science-answer-slo-qc.md"
      - "scripts/audit_grade11_unit7_topic73_batch2_v170.cjs"
      - ".github/workflows/validate-grade11-v170-topic73-q21-q40-qc.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/topic73-v170-q21-q40-source-bound-academic-review-no-keys.json"
      - "quality/grade11-v170-topic73-q21-q40-science-answer-slo-qc.md"
      - "scripts/audit_grade11_unit7_topic73_batch2_v170.cjs"
      - ".github/workflows/validate-grade11-v170-topic73-q21-q40-qc.yml"
  workflow_dispatch:
jobs:
  verify-keyless-original-topic73-q21-to-q40-and-scoring-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check Topic7.3 V170 original-source audit
        run: node --check scripts/audit_grade11_unit7_topic73_batch2_v170.cjs
      - name: Verify private source fingerprints, science decisions and sixteen release-denial mutations
        run: node scripts/audit_grade11_unit7_topic73_batch2_v170.cjs
      - name: Preserve V169 original Topic7.3 first20 academic review and pending decisions
        run: node scripts/audit_grade11_unit7_topic73_batch1_v169.cjs
      - name: Preserve original Topic7.2 full80 keyless source and score-release holds
        run: node scripts/audit_grade11_unit7_topic72_bank_v168.cjs
      - name: Preserve Topic7.1 original eighty science/cognitive academic signoffs pending
        run: node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve 2250 original Grade XI provisional question identities
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve original Unit6 560 teacher-pending signoffs and no-scoring release
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve production and staging teacher backend deployment NO-GO
        run: |
          node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
          node scripts/audit_grade11_v161_staging_callable_contract.cjs
      - name: Preserve App Check production entrypoints and student reporting launch lock
        run: |
          node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
          node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Upload aggregate keyless QA summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v170-original-topic73-q21-q40-keyless-qc
          path: qa-artifacts/grade11-v170-topic73-q21-q40-keyless-qc/summary.json
          if-no-files-found: warn
          retention-days: 14
