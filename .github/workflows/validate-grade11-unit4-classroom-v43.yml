name: Validate Grade XI Unit 4 Classroom Browser & Print QC (V43)

on:
  pull_request:
    paths:
      - "portal/unit-04-assessment-pack.*"
      - "portal/unit-04-mcq-full80.*"
      - "portal/unit-04-descriptive-practice.*"
      - "scripts/test_unit04_classroom_browser_v43.cjs"
      - "quality/grade11-unit04-classroom-readiness-v43.md"
      - ".github/workflows/validate-grade11-unit4-classroom-v43.yml"
  push:
    branches: [main]
    paths:
      - "portal/unit-04-assessment-pack.*"
      - "portal/unit-04-mcq-full80.*"
      - "portal/unit-04-descriptive-practice.*"
      - "scripts/test_unit04_classroom_browser_v43.cjs"
      - "quality/grade11-unit04-classroom-readiness-v43.md"
      - ".github/workflows/validate-grade11-unit4-classroom-v43.yml"
  workflow_dispatch:

jobs:
  student-teacher-chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser QA script syntax
        run: node --check scripts/test_unit04_classroom_browser_v43.cjs
      - name: Install pinned Playwright for ephemeral CI run only
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
      - name: Install Chromium and necessary Linux libraries
        run: npx playwright install --with-deps chromium
      - name: Run real-browser functional, mobile and print-mode checks
        run: node scripts/test_unit04_classroom_browser_v43.cjs
      - name: Preserve browser reference screenshots for teacher QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit04-v43-browser-and-print-reference-screenshots
          path: qa-artifacts/unit04-v43/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Recheck existing integrated academic/source-bank assertions
        run: |
          node scripts/test_unit04_assessment_pack_v42.cjs
          node scripts/test_unit04_descriptive_v41.cjs
          node scripts/test_unit04_mcq_v39.cjs
          node scripts/test_unit04_qc_v40.cjs
