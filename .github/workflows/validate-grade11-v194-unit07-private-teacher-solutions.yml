name: Grade XI V194 Unit7 Private Teacher Solutions QC (HOLD NO DEPLOY)
on:
  pull_request:
    paths:
      - "quality/unit07/unit07-v194-teacher-solution-draft-provenance-no-keys.json"
      - "quality/grade11-v194-unit07-private-teacher-solutions-qc.md"
      - "scripts/audit_grade11_unit07_teacher_solution_qc_v194.cjs"
      - ".github/workflows/validate-grade11-v194-unit07-private-teacher-solutions.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/unit07-v194-teacher-solution-draft-provenance-no-keys.json"
      - "quality/grade11-v194-unit07-private-teacher-solutions-qc.md"
      - "scripts/audit_grade11_unit07_teacher_solution_qc_v194.cjs"
      - ".github/workflows/validate-grade11-v194-unit07-private-teacher-solutions.yml"
  workflow_dispatch:
jobs:
  private-teacher-guide-source-math-no-score:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check V194 academic source/mathematics audit syntax
        run: node --check scripts/audit_grade11_unit07_teacher_solution_qc_v194.cjs
      - name: Verify page-126 arithmetic and private six-page draft with all scores HOLD
        run: node scripts/audit_grade11_unit07_teacher_solution_qc_v194.cjs
      - name: Preserve V193 full Unit7 source scan and numerical discrepancies
        run: node scripts/audit_grade11_unit07_original_pdf_source_v193.cjs
      - name: Preserve V192 exact private Q25 model science disposition
        run: node scripts/audit_grade11_unit07_q25_disposition_v192.cjs
      - name: Preserve V191 offline evidence not being authenticated approval
        run: node scripts/test_grade11_unit07_offline_review_evidence_v191.cjs
      - name: Preserve V190 revision-bound mocked roles, replay and revocation
        run: node scripts/test_grade11_unit07_revision_bound_review_v190.cjs
      - name: Preserve V189 Q22 supporting-only and Q25 academic HOLD
        run: node scripts/audit_grade11_unit07_two_candidate_review_v189.cjs
      - name: Preserve V188 private pilot source identities
        run: node scripts/audit_grade11_unit07_private_pilot_v188.cjs
      - name: Preserve V187 safe offline candidate manifest intake
        run: node scripts/test_grade11_unit07_private_manifest_v187.cjs
      - name: Preserve V186 immutable synthetic revision denial
        run: node scripts/test_grade11_unit07_offline_protocol_v186.cjs
      - name: Preserve V185 original 72-item teacher approval readiness
        run: node scripts/audit_grade11_unit07_teacher_readiness_v185.cjs
      - name: Preserve V184 through V179 six original private teacher review batches
        run: |
          node scripts/audit_grade11_unit07_teacher_batch06_v184.cjs
          node scripts/audit_grade11_unit07_teacher_batch05_v183.cjs
          node scripts/audit_grade11_unit07_teacher_batch04_v182.cjs
          node scripts/audit_grade11_unit07_teacher_batch03_v181.cjs
          node scripts/audit_grade11_unit07_teacher_batch02_v180.cjs
          node scripts/audit_grade11_unit07_teacher_batch01_v179.cjs
      - name: Preserve V178 original 274 review inventory and V177 numerical QC
        run: |
          node scripts/audit_grade11_unit07_teacher_approval_index_v178.cjs
          node scripts/audit_grade11_unit07_numericals_v177.cjs
      - name: Preserve original comprehensive/short/multiple-choice exercises
        run: |
          node scripts/audit_grade11_unit07_comprehensive_v176.cjs
          node scripts/audit_grade11_unit07_short_v175.cjs
          node scripts/audit_grade11_unit07_exercise_mcq_v174.cjs
      - name: Preserve 240 source-pinned original Topic7.1-7.3 question identities
        run: |
          node scripts/audit_grade11_unit7_topic73_bank_v173.cjs
          node scripts/audit_grade11_unit7_topic72_bank_v168.cjs
          node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve Grade XI 2250 existing original source-pinned questions
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve Unit6 560 pending teacher signoffs
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve teacher backend staging and production NO-GO
        run: |
          node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
          node scripts/audit_grade11_v161_staging_callable_contract.cjs
      - name: Preserve App Check browser and reporting launch locks
        run: |
          node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
          node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Upload counts-only source/QC summary without confidential teacher answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v194-unit7-private-teacher-worked-guide-hold
          path: qa-artifacts/grade11-v194-unit07-private-teacher-guide/summary.json
          if-no-files-found: warn
          retention-days: 14
