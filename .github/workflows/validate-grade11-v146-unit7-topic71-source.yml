name: Grade XI V146 Unit7 Topic7.1 80-Item Source Fingerprint and Academic Hold
on:
  pull_request:
    paths:
      - "quality/unit07/topic71-v146-teacher-80-item-source-fingerprint-ledger.json"
      - "quality/grade11-v146-topic71-mcq-source-review-and-teacher-decision.md"
      - "scripts/audit_grade11_unit7_topic71_source_v146.cjs"
      - ".github/workflows/validate-grade11-v146-unit7-topic71-source.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/topic71-v146-teacher-80-item-source-fingerprint-ledger.json"
      - "quality/grade11-v146-topic71-mcq-source-review-and-teacher-decision.md"
      - "scripts/audit_grade11_unit7_topic71_source_v146.cjs"
      - ".github/workflows/validate-grade11-v146-unit7-topic71-source.yml"
  workflow_dispatch:
jobs:
  verify-source-identity-and-unreleased-unit7-academic-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check 80 item source fingerprint register syntax
        run: |
          node --check scripts/audit_grade11_unit7_topic71_source_v146.cjs
          node -e "JSON.parse(require('node:fs').readFileSync('quality/unit07/topic71-v146-teacher-80-item-source-fingerprint-ledger.json','utf8'))"
      - name: Check all 80 original source identity hashes topic coverage and pending signoffs
        run: node scripts/audit_grade11_unit7_topic71_source_v146.cjs
      - name: Preserve original 2250 Grade XI provisional MCQ source references
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve Unit6 560 pending teacher approvals and blocked graded release
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve existing public Grade XI learner resource and link readiness
        run: node scripts/test_grade11_exam_readiness_v118.cjs
      - name: Upload source-fingerprint counts and pending decisions only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v146-topic71-80-original-source-qc-evidence
          path: qa-artifacts/grade11-v146-unit7-topic71-source-qc/summary.json
          if-no-files-found: warn
          retention-days: 14
