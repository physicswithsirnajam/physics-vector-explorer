name: Grade XI V228 Unit 8 Topic 8.4 First Law
on:
  pull_request:
    paths:
      - "portal/unit-08-topic84-first-law-v228.html"
      - "portal/unit-08-topic83-gas-laws-v227.html"
      - "portal/learning-catalog.json"
      - "portal/exam-quick-access.html"
      - "shared/navigation.js"
      - "scripts/test_grade11_v228_unit8_topic84_source_browser.cjs"
      - "scripts/test_grade11_v227_unit8_topic83_source_browser.cjs"
      - "scripts/test_grade11_v226_unit8_topic82_source_browser.cjs"
      - "quality/grade11-v228-unit8-topic84-first-law-signs-science.md"
      - ".github/workflows/validate-grade11-v228-unit8-topic84-first-law.yml"
  push:
    branches: [main]
    paths:
      - "portal/unit-08-topic84-first-law-v228.html"
      - "portal/unit-08-topic83-gas-laws-v227.html"
      - "portal/learning-catalog.json"
      - "portal/exam-quick-access.html"
      - "shared/navigation.js"
      - "scripts/test_grade11_v228_unit8_topic84_source_browser.cjs"
      - "scripts/test_grade11_v227_unit8_topic83_source_browser.cjs"
      - "scripts/test_grade11_v226_unit8_topic82_source_browser.cjs"
      - ".github/workflows/validate-grade11-v228-unit8-topic84-first-law.yml"
jobs:
  source-first-law-signed-energy-and-browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JS and JSON for First Law and existing navigation
        run: |
          node --check shared/navigation.js
          node --check scripts/test_grade11_v228_unit8_topic84_source_browser.cjs
          node --check scripts/test_grade11_v227_unit8_topic83_source_browser.cjs
          node --check scripts/test_grade11_v226_unit8_topic82_source_browser.cjs
          node -e "JSON.parse(require('fs').readFileSync('portal/learning-catalog.json','utf8'));JSON.parse(require('fs').readFileSync('quality/unit08/unit08-v224-original-textbook-source-slo-inventory-no-keys.json','utf8'))"
      - name: Preserve 2250 original Units1-6 question IDs options and answer keys
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Install pinned headless Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install chromium
      - name: V228 textbook pp135-140 first-law science and 1280 390 320 actual browser
        run: node scripts/test_grade11_v228_unit8_topic84_source_browser.cjs
      - name: Preserve V227 gas laws and its source calculations
        run: node scripts/test_grade11_v227_unit8_topic83_source_browser.cjs
      - name: Preserve V226 kinetic gas and signed piston work
        run: node scripts/test_grade11_v226_unit8_topic82_source_browser.cjs
      - name: Preserve V225 first unit8 unscored lesson Example and Assignment 8.1
        run: node scripts/test_grade11_v225_unit8_topic81_source_browser.cjs
      - name: Preserve V224 original Unit8 source and framework inventory
        run: node scripts/test_grade11_v224_unit8_original_source_slo_manifest.cjs
      - name: Preserve V209 three unscored Unit7 lessons and release hold
        run: node scripts/test_grade11_v209_unit7_learning_discovery.cjs
      - name: Preserve V140 unit-aware future menu navigation
        run: node scripts/test_grade11_v140_unit_aware_sidebar_browser.cjs
      - name: Archive anonymous real-browser science evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v228-unit08-topic84-first-law-browser
          path: qa-artifacts/grade11-v228-unit08-topic84-first-law-browser/evidence.json
          if-no-files-found: warn
          retention-days: 14
