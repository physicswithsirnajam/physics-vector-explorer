name: Grade XI Unit 6 V114 Approved Bernoulli Practice and PDF QA
on:
  pull_request:
    paths:
      - "question-bank/grade-11/unit-06-topic65-v114-approved-practice-overlay.json"
      - "shared/practice-bank-adapter-v55.js"
      - "portal/unit-06-topic-65-preview.*"
      - "portal/unit-06-balanced-mcq-v95c1.*"
      - "practice-engine/index.html"
      - "build-your-physics-test.html"
      - "scripts/test_grade11_u06_v114_approved_bernoulli_practice_overlay.cjs"
      - "scripts/test_grade11_u06_v111_approved_practice_overlay.cjs"
      - "scripts/test_grade11_unit06_central_v*.cjs"
      - "scripts/test_grade11_unit06_v95c1_balanced_assessment.cjs"
      - "server/approved-practice-catalog-v99g.cjs"
      - "server/review-manifests/grade11-approved-public-review-refs-v99i.json"
      - ".github/workflows/validate-grade11-u06-v114-bernoulli-practice-overlay.yml"
  push:
    branches: [main]
    paths:
      - "question-bank/grade-11/unit-06-topic65-v114-approved-practice-overlay.json"
      - "shared/practice-bank-adapter-v55.js"
      - "portal/unit-06-topic-65-preview.*"
      - "portal/unit-06-balanced-mcq-v95c1.*"
      - "practice-engine/index.html"
      - "build-your-physics-test.html"
      - "scripts/test_grade11_u06_v114_approved_bernoulli_practice_overlay.cjs"
      - "scripts/test_grade11_u06_v111_approved_practice_overlay.cjs"
      - "scripts/test_grade11_unit06_central_v*.cjs"
      - "scripts/test_grade11_unit06_v95c1_balanced_assessment.cjs"
      - "server/approved-practice-catalog-v99g.cjs"
      - "server/review-manifests/grade11-approved-public-review-refs-v99i.json"
      - ".github/workflows/validate-grade11-u06-v114-bernoulli-practice-overlay.yml"
  workflow_dispatch:
jobs:
  approved-practice-source-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax validation of V114 overlay, all student routes and historical regressions
        run: |
          node --check shared/practice-bank-adapter-v55.js
          node --check portal/unit-06-topic-65-preview.js
          node --check portal/unit-06-balanced-mcq-v95c1.js
          node --check scripts/test_grade11_u06_v114_approved_bernoulli_practice_overlay.cjs
          node --check scripts/test_grade11_u06_v111_approved_practice_overlay.cjs
      - name: Install pinned real Chromium and all-page PDF text inspector
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdfinfo -v
          pdftotext -v
      - name: Verify V114 exact source, all-80 corrected practice, 560 central items, 2250 refs, blocked originals and watermarked PDFs
        run: node scripts/test_grade11_u06_v114_approved_bernoulli_practice_overlay.cjs
      - name: Preserve V111 continuity four-item original-source and real-browser fail-closed checks
        run: node scripts/test_grade11_u06_v111_approved_practice_overlay.cjs
      - name: Preserve 80-original Topic 6.5 prepared-source and 390px direct quiz
        run: node scripts/test_unit06_topic65_v84.cjs
      - name: Preserve seven-topic 28-question accurate scoring and responsive balancing
        run: node scripts/test_grade11_unit06_v95c1_balanced_assessment.cjs
      - name: Preserve six central source-to-practice provenance and original 560 inventory invariants
        run: |
          node scripts/test_grade11_unit06_central_v79.cjs
          node scripts/test_grade11_unit06_central_v81.cjs
          node scripts/test_grade11_unit06_central_v83.cjs
          node scripts/test_grade11_unit06_central_v85.cjs
          node scripts/test_grade11_unit06_central_v87.cjs
          node scripts/test_grade11_unit06_central_v89.cjs
      - name: Rebuild and verify exact 2250 answer-free pinned public report-reference catalog
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve V113 teacher candidate source and three original D/C/C keys
        run: node scripts/test_grade11_unit6_v113_topic65_teacher_proposals.cjs
      - name: Preserve Topic 6.5 final20 historical original-source answer letter audit
        run: node scripts/test_grade11_unit06_v95c2t_topic65_last20_scenarios.cjs
      - name: Preserve sitewide V112 real-PDF watermark and scientific superscripts
        run: node scripts/test_grade11_v112_universal_science_print.cjs
      - name: Preserve all official exam nonrelease and teacher signoff restrictions
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Upload only synthetic and public-page browser/PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-u06-v114-bernoulli-source-preservation-and-PDF-QA
          path: |
            qa-artifacts/unit6-v114-bernoulli-overlay/
            qa-artifacts/unit6-v111-practice-overlay/
            qa-artifacts/v112-universal-science-print/
          if-no-files-found: warn
          retention-days: 10
