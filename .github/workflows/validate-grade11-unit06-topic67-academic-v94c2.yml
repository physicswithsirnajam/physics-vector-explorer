name: Validate Grade XI Unit 6 Topic 6.7 Academic QC (V94-C2.7)
on:
  pull_request:
    paths:
      - "quality/grade11-unit06-v94c2-topic67-detailed-qc.md"
      - "scripts/test_grade11_unit06_topic67_academic_v94c2.cjs"
      - ".github/workflows/validate-grade11-unit06-topic67-academic-v94c2.yml"
  push:
    branches: [main]
    paths:
      - "quality/grade11-unit06-v94c2-topic67-detailed-qc.md"
      - "scripts/test_grade11_unit06_topic67_academic_v94c2.cjs"
      - ".github/workflows/validate-grade11-unit06-topic67-academic-v94c2.yml"
  workflow_dispatch:
jobs:
  topic67-superfluidity-source-and-math-review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check superfluidity audit test syntax
        run: node --check scripts/test_grade11_unit06_topic67_academic_v94c2.cjs
      - name: Verify supplement-only temperature arithmetic, figure restrictions and portal inventory
        run: node scripts/test_grade11_unit06_topic67_academic_v94c2.cjs
