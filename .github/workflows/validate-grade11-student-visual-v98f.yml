name: Grade XI Unit 6 Study and Practice Visual Audit (V98-F)
on:
  pull_request:
    paths:
      - "portal/unit-06-topic-61-study-v95b1.html"
      - "portal/unit-06-topic-62-study-v95b2.html"
      - "portal/unit-06-topic-63-study-v95b3.html"
      - "portal/unit-06-topic-64-study-v95b4.html"
      - "portal/unit-06-topic-65-study-v95b5.html"
      - "portal/unit-06-topic-66-study-v95b6.html"
      - "portal/unit-06-balanced-mcq-v95c1.html"
      - "portal/unit-06-learning-desk-v95a.html"
      - "portal/assets/physics-with-sir-najam-official-logo.png"
      - "scripts/audit_grade11_student_visual_v98f.cjs"
      - ".github/workflows/validate-grade11-student-visual-v98f.yml"
  push:
    branches: [main]
    paths:
      - "portal/unit-06-topic-61-study-v95b1.html"
      - "portal/unit-06-topic-62-study-v95b2.html"
      - "portal/unit-06-topic-63-study-v95b3.html"
      - "portal/unit-06-topic-64-study-v95b4.html"
      - "portal/unit-06-topic-65-study-v95b5.html"
      - "portal/unit-06-topic-66-study-v95b6.html"
      - "portal/unit-06-balanced-mcq-v95c1.html"
      - "portal/unit-06-learning-desk-v95a.html"
      - "portal/assets/physics-with-sir-najam-official-logo.png"
      - "scripts/audit_grade11_student_visual_v98f.cjs"
      - ".github/workflows/validate-grade11-student-visual-v98f.yml"
  workflow_dispatch:
jobs:
  six-unit06-lessons-and-balanced-practice-visual-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone audit syntax
        run: node --check scripts/audit_grade11_student_visual_v98f.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify Unit 6 topic lessons and balanced MCQs on desktop and phone without login
        run: node scripts/audit_grade11_student_visual_v98f.cjs
      - name: Preserve screenshots and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-unit06-student-visual-v98f-evidence
          path: qa-artifacts/student-visual-v98f/
          retention-days: 10
          if-no-files-found: warn
