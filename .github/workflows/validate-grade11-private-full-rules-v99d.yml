name: Grade XI Full Firestore Rules Regression — Private Baseline (V99-D)
on:
  pull_request:
    paths:
      - "scripts/test_grade11_full_firestore_rules_v99d.cjs"
      - "security-proposals/v99c/emulator-only.json"
      - ".github/workflows/validate-grade11-private-full-rules-v99d.yml"
  push:
    branches: [main]
    paths:
      - "scripts/test_grade11_full_firestore_rules_v99d.cjs"
      - "security-proposals/v99c/emulator-only.json"
      - ".github/workflows/validate-grade11-private-full-rules-v99d.yml"
  workflow_dispatch:
jobs:
  private-baseline-no-deploy-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GCLOUD_PROJECT: demo-psn-v99d-full-rules
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax-check full-policy emulator runner
        run: node --check scripts/test_grade11_full_firestore_rules_v99d.cjs
      - name: Require encrypted private rules baseline (do not print its contents)
        env:
          PSN_FIRESTORE_BASELINE_RULES: ${{ secrets.PSN_FIRESTORE_BASELINE_RULES }}
        run: |
          if [ -z "$PSN_FIRESTORE_BASELINE_RULES" ]; then
            echo "::error::The private PSN_FIRESTORE_BASELINE_RULES repository secret is missing. Do NOT merge or replace this check with a stub."
            exit 1
          fi
          echo "Encrypted private rules baseline is configured."
      - name: Install pinned Firebase emulator/test dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts firebase@13.4.0 @firebase/rules-unit-testing@6.0.0 firebase-tools@15.37.0
      - name: Test owner-provided complete rules plus isolated additive report match
        env:
          PSN_FIRESTORE_BASELINE_RULES: ${{ secrets.PSN_FIRESTORE_BASELINE_RULES }}
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99c/emulator-only.json
          --only firestore
          --project demo-psn-v99d-full-rules
          "node scripts/test_grade11_full_firestore_rules_v99d.cjs"
      - name: Upload only synthetic access-test evidence, never the source rules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-private-full-rules-v99d-evidence
          path: qa-artifacts/full-firestore-rules-v99d/
          if-no-files-found: warn
          retention-days: 14
