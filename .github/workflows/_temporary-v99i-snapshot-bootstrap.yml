name: Temporary V99-I Source ID Snapshot Bootstrap
on:
  push:
    branches: [portal-v99i-freeze-reviewed-grade11-2250-catalog]
    paths:
      - "scripts/_temporary_emit_grade11_snapshot_v99i.cjs"
      - ".github/workflows/_temporary-v99i-snapshot-bootstrap.yml"
  workflow_dispatch:
jobs:
  emit-public-ids-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Emit bounded public ID-only manifest chunks from verified V99-H builder
        run: node scripts/_temporary_emit_grade11_snapshot_v99i.cjs
