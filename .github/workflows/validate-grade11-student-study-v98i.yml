name: Grade XI Student Study and Numericals Visual Audit (V98-I)
on:
  pull_request:
    paths:
      - "portal/unit-01-study-guide.html"
      - "portal/unit-01-numericals.html"
      - "portal/unit-02-formula-sheet.html"
      - "portal/unit-02-numericals.html"
      - "portal/unit-03-study-guide.html"
      - "portal/unit-03-numericals.html"
      - "portal/unit-03-numericals.js"
      - "question-bank/grade-11/unit-03-textbook-numericals.json"
      - "portal/unit-05-work-study.html"
      - "portal/assets/physics-with-sir-najam-official-logo.png"
      - "shared/navigation.css"
      - "shared/navigation.js"
      - "scripts/audit_grade11_student_study_v98i.cjs"
      - ".github/workflows/validate-grade11-student-study-v98i.yml"
  push:
    branches: [main]
    paths:
      - "portal/unit-01-study-guide.html"
      - "portal/unit-01-numericals.html"
      - "portal/unit-02-formula-sheet.html"
      - "portal/unit-02-numericals.html"
      - "portal/unit-03-study-guide.html"
      - "portal/unit-03-numericals.html"
      - "portal/unit-03-numericals.js"
      - "question-bank/grade-11/unit-03-textbook-numericals.json"
      - "portal/unit-05-work-study.html"
      - "portal/assets/physics-with-sir-najam-official-logo.png"
      - "shared/navigation.css"
      - "shared/navigation.js"
      - "scripts/audit_grade11_student_study_v98i.cjs"
      - ".github/workflows/validate-grade11-student-study-v98i.yml"
  workflow_dispatch:
jobs:
  seven-student-study-and-numerical-views:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify student study browser script syntax
        run: node --check scripts/audit_grade11_student_study_v98i.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Check seven public learning resources on desktop and two phone widths
        run: node scripts/audit_grade11_student_study_v98i.cjs
      - name: Preserve source-local audit evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-student-study-v98i-evidence
          path: qa-artifacts/student-study-v98i/
          if-no-files-found: warn
          retention-days: 10
