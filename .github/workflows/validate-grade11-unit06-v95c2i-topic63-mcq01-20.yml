name: Validate Grade XI Unit 6 Topic 6.3 MCQ 1-20 Academic QC (V95-C2I)
on:
  pull_request:
    paths:
      - "quality/grade11-unit06-v95c2i-topic63-mcq01-20-academic-review.csv"
      - "quality/grade11-unit06-v95c2i-topic63-mcq01-20-academic-review.md"
      - "scripts/test_grade11_unit06_v95c2i_topic63_first20_academic.cjs"
      - ".github/workflows/validate-grade11-unit06-v95c2i-topic63-mcq01-20.yml"
  push:
    branches: [main]
    paths:
      - "quality/grade11-unit06-v95c2i-topic63-mcq01-20-academic-review.csv"
      - "quality/grade11-unit06-v95c2i-topic63-mcq01-20-academic-review.md"
      - "scripts/test_grade11_unit06_v95c2i_topic63_first20_academic.cjs"
      - ".github/workflows/validate-grade11-unit06-v95c2i-topic63-mcq01-20.yml"
  workflow_dispatch:
jobs:
  topic63-first20-source-science-slo-and-teacher-review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source MCQ 1-20, six teacher notes and inherited Unit6 safe-release regressions
        run: |
          node --check scripts/test_grade11_unit06_v95c2i_topic63_first20_academic.cjs
          node scripts/test_grade11_unit06_v95c2i_topic63_first20_academic.cjs
          node scripts/test_grade11_unit06_v95c2h_topic62_last20_scenarios.cjs
          node scripts/test_grade11_unit06_v95c2g_topic62_num41_60_academic.cjs
          node scripts/test_grade11_unit06_v95c2f_topic62_second20_academic.cjs
          node scripts/test_grade11_unit06_v95c2e_topic62_first20_academic.cjs
          node scripts/test_grade11_unit06_v95c2d_topic61_scenarios.cjs
          node scripts/test_grade11_unit06_v95c2c_topic61_mcq41_64_numerical.cjs
          node scripts/test_grade11_unit06_v95c2b_topic61_mcq21_40_academic.cjs
          node scripts/test_grade11_unit06_v95c2a_topic61_first20_academic.cjs
          node scripts/test_grade11_unit06_v95c1_balanced_assessment.cjs
          node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
