name: Validate Grade XI Unit 6 Topic 6.2 Q21-40 Academic QC (V95-C2F)
on:
  pull_request:
    paths:
      - "quality/grade11-unit06-v95c2f-topic62-mcq21-40-academic-review.csv"
      - "quality/grade11-unit06-v95c2f-topic62-mcq21-40-academic-review.md"
      - "scripts/test_grade11_unit06_v95c2f_topic62_second20_academic.cjs"
      - ".github/workflows/validate-grade11-unit06-v95c2f-topic62-q21-40.yml"
  push:
    branches: [main]
    paths:
      - "quality/grade11-unit06-v95c2f-topic62-mcq21-40-academic-review.csv"
      - "quality/grade11-unit06-v95c2f-topic62-mcq21-40-academic-review.md"
      - "scripts/test_grade11_unit06_v95c2f_topic62_second20_academic.cjs"
      - ".github/workflows/validate-grade11-unit06-v95c2f-topic62-q21-40.yml"
  workflow_dispatch:
jobs:
  topic62-second20-scientific-review-and-release-holds:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Topic6.2 Q21-40 snapshot, teacher issues and inherited release gates
        run: |
          node --check scripts/test_grade11_unit06_v95c2f_topic62_second20_academic.cjs
          node scripts/test_grade11_unit06_v95c2f_topic62_second20_academic.cjs
          node scripts/test_grade11_unit06_v95c2e_topic62_first20_academic.cjs
          node scripts/test_grade11_unit06_v95c2d_topic61_scenarios.cjs
          node scripts/test_grade11_unit06_v95c2c_topic61_mcq41_64_numerical.cjs
          node scripts/test_grade11_unit06_v95c2b_topic61_mcq21_40_academic.cjs
          node scripts/test_grade11_unit06_v95c2a_topic61_first20_academic.cjs
          node scripts/test_grade11_unit06_v95c1_balanced_assessment.cjs
          node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
