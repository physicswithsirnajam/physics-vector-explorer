name: Grade XI V196 Unit7 SI Numerical/Graph Scaling Regression (NO SCORE)
on:
  pull_request:
    paths:
      - "scripts/unit07_numerical_scaling_v196.cjs"
      - "scripts/test_grade11_unit07_numerical_scaling_v196.cjs"
      - "quality/unit07/unit07-v196-numerical-scaling-regression-hold.json"
      - "quality/grade11-v196-unit07-numerical-invariants-teacher-hold.md"
      - ".github/workflows/validate-grade11-v196-unit07-numerical-scaling.yml"
  push:
    branches: [main]
    paths:
      - "scripts/unit07_numerical_scaling_v196.cjs"
      - "scripts/test_grade11_unit07_numerical_scaling_v196.cjs"
      - "quality/unit07/unit07-v196-numerical-scaling-regression-hold.json"
      - "quality/grade11-v196-unit07-numerical-invariants-teacher-hold.md"
      - ".github/workflows/validate-grade11-v196-unit07-numerical-scaling.yml"
  workflow_dispatch:
jobs:
  validate-source-based-scaling-and-no-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check SI physics helper and scaling tests
        run: |
          node --check scripts/unit07_numerical_scaling_v196.cjs
          node --check scripts/test_grade11_unit07_numerical_scaling_v196.cjs
      - name: Check numerical/units invariants, nonlinear axes, malformed-input and student HOLD
        run: node scripts/test_grade11_unit07_numerical_scaling_v196.cjs
      - name: Preserve V195 unsigned teacher decisions and complete source-based numerical checks
        run: node scripts/audit_grade11_unit07_teacher_decision_pack_v195.cjs
      - name: Preserve V194 private worked solution mathematics and original notes
        run: node scripts/audit_grade11_unit07_teacher_solution_qc_v194.cjs
      - name: Preserve V193 original two-PDF source verification and arithmetic
        run: node scripts/audit_grade11_unit07_original_pdf_source_v193.cjs
      - name: Preserve V192 source-bound model-only science with real Q25 signoff PENDING
        run: node scripts/audit_grade11_unit07_q25_disposition_v192.cjs
      - name: Preserve V191 offline evidence not authenticated teacher signoff
        run: node scripts/test_grade11_unit07_offline_review_evidence_v191.cjs
      - name: Preserve V190 synthetic revision-bound staged decisions and revocation
        run: node scripts/test_grade11_unit07_revision_bound_review_v190.cjs
      - name: Preserve V189 original Q22 supporting and Q25 source/SLO status
        run: node scripts/audit_grade11_unit07_two_candidate_review_v189.cjs
      - name: Preserve V188 original two private candidate source identities
        run: node scripts/audit_grade11_unit07_private_pilot_v188.cjs
      - name: Preserve V187 local private manifest path security and source binding
        run: node scripts/test_grade11_unit07_private_manifest_v187.cjs
      - name: Preserve V186 synthetic SHA revisions and decision revocation
        run: node scripts/test_grade11_unit07_offline_protocol_v186.cjs
      - name: Preserve V185 72 detailed private candidate HOLD
        run: node scripts/audit_grade11_unit07_teacher_readiness_v185.cjs
      - name: Preserve original six private teacher candidate queues V184 to V179
        run: |
          node scripts/audit_grade11_unit07_teacher_batch06_v184.cjs
          node scripts/audit_grade11_unit07_teacher_batch05_v183.cjs
          node scripts/audit_grade11_unit07_teacher_batch04_v182.cjs
          node scripts/audit_grade11_unit07_teacher_batch03_v181.cjs
          node scripts/audit_grade11_unit07_teacher_batch02_v180.cjs
          node scripts/audit_grade11_unit07_teacher_batch01_v179.cjs
      - name: Preserve original 274 source items and numerical/textbook exercise controls
        run: |
          node scripts/audit_grade11_unit07_teacher_approval_index_v178.cjs
          node scripts/audit_grade11_unit07_numericals_v177.cjs
          node scripts/audit_grade11_unit07_comprehensive_v176.cjs
          node scripts/audit_grade11_unit07_short_v175.cjs
          node scripts/audit_grade11_unit07_exercise_mcq_v174.cjs
      - name: Preserve original three 80-item owner question banks
        run: |
          node scripts/audit_grade11_unit7_topic73_bank_v173.cjs
          node scripts/audit_grade11_unit7_topic72_bank_v168.cjs
          node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve original 2250 Grade XI source-pinned items and Unit6 560 teacher hold
        run: |
          node scripts/test_grade11_pinned_review_catalog_v99i.cjs
          node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve teacher backend production/staging NO-GO
        run: |
          node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
          node scripts/audit_grade11_v161_staging_callable_contract.cjs
      - name: Preserve browser App Check and reporting lock
        run: |
          node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
          node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Upload only counts-based mathematical test status, not private source content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v196-unit7-SI-invariants-no-scoring
          path: qa-artifacts/grade11-v196-numerical-invariants/summary.json
          if-no-files-found: warn
          retention-days: 14
