name: Validate Grade XI Unit6 Two-Topic Central Builder (V79)
on:
  pull_request:
    paths:
      - "shared/practice-bank-adapter-v55.js"
      - "shared/multi-unit-planner-v56.js"
      - "build-your-physics-test.html"
      - "practice-engine/index.html"
      - "portal/index.html"
      - "portal/learning-catalog.json"
      - "question-bank/manifest.json"
      - "scripts/test_grade11_unit06_central_v79.cjs"
      - "scripts/test_grade11_central_v77.cjs"
      - "scripts/test_unit06_topic62_v78.cjs"
      - ".github/workflows/validate-grade11-central-unit06-v77.yml"
      - ".github/workflows/validate-grade11-central-unit06-v79.yml"
  push:
    branches: [main]
    paths:
      - "shared/practice-bank-adapter-v55.js"
      - "shared/multi-unit-planner-v56.js"
      - "build-your-physics-test.html"
      - "practice-engine/index.html"
      - "portal/index.html"
      - "portal/learning-catalog.json"
      - "question-bank/manifest.json"
      - "scripts/test_grade11_unit06_central_v79.cjs"
      - "scripts/test_grade11_central_v77.cjs"
      - "scripts/test_unit06_topic62_v78.cjs"
      - ".github/workflows/validate-grade11-central-unit06-v77.yml"
      - ".github/workflows/validate-grade11-central-unit06-v79.yml"
  workflow_dispatch:
jobs:
  verify-original-sources-and-student-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and count invariants
        run: |
          node --check shared/practice-bank-adapter-v55.js
          node --check shared/multi-unit-planner-v56.js
          node --check scripts/test_grade11_unit06_central_v79.cjs
          node -e "const m=require('./question-bank/manifest.json').grades.find(g=>g.grade===11).units;if(m.slice(0,5).reduce((n,u)=>n+u.liveMcqCount,0)!==1690||m[5].liveMcqCount!==156)process.exit(1)"
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: V79 original source fidelity and end-to-end browser checks
        run: node scripts/test_grade11_unit06_central_v79.cjs
      - name: Recheck standalone original Topic6.1 and Topic6.2 preview
        run: |
          node scripts/test_unit06_topic61_v76.cjs
          node scripts/test_unit06_topic62_v78.cjs
      - name: Regression on V77 mixed-unit and original five-bank questions
        run: |
          node scripts/test_grade11_central_v77.cjs
          node scripts/test_builder_five_units_v55.cjs
          node scripts/test_builder_multiunit_v56.cjs
      - name: Upload synthetic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit06-v79-two-topic-builder-mobile
          path: qa-artifacts/unit06-v79/*.png
          if-no-files-found: warn
          retention-days: 7
