  push:
    branches: [main]
    paths:
      - "scripts/audit_grade11_student_visual_v98g.cjs"
      - ".github/workflows/validate-grade11-student-visual-v98g.yml"
      - "portal/assets/physics-with-sir-najam-official-logo.png"
