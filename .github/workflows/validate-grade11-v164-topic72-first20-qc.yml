name: Grade XI V164 Unit7.2 First-20 Source-Bound Science and FBISE QC (NO KEY RELEASE)
on:
  pull_request:
    paths:
      - "quality/unit07/topic72-v164-first20-source-bound-teacher-review-no-keys.json"
      - "quality/grade11-v164-topic72-first20-scientific-answer-slo-qc.md"
      - "scripts/audit_grade11_unit7_topic72_batch1_v164.cjs"
      - ".github/workflows/validate-grade11-v164-topic72-first20-qc.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/topic72-v164-first20-source-bound-teacher-review-no-keys.json"
      - "quality/grade11-v164-topic72-first20-scientific-answer-slo-qc.md"
      - "scripts/audit_grade11_unit7_topic72_batch1_v164.cjs"
      - ".github/workflows/validate-grade11-v164-topic72-first20-qc.yml"
  workflow_dispatch:
jobs:
  source-bound-first20-without-answer-letters-or-scored-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check source-bound reviewer-only first-20 audit
        run: node --check scripts/audit_grade11_unit7_topic72_batch1_v164.cjs
      - name: Verify 20 private-row fingerprints, source SLO scope and scientific review HOLD
        run: node scripts/audit_grade11_unit7_topic72_batch1_v164.cjs
      - name: Preserve prior 7.1 80 owner-science signoffs PENDING
        run: node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve original 2250 Grade XI provisional MCQs
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve original Unit6 560 teacher signoff and release hold
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve production NO-GO and staging source-only contract
        run: |
          node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
          node scripts/audit_grade11_v161_staging_callable_contract.cjs
      - name: Preserve App Check browser entrypoint inventory and report launch lock
        run: |
          node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
          node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Upload counts and provenance only - no keyed owner source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v164-topic72-first20-keyless-science-qc
          path: qa-artifacts/grade11-v164-unit7-topic72-first20/summary.json
          if-no-files-found: warn
          retention-days: 14
