name: Validate Grade XI Unit 6 Topic 6.4 Academic QC (V94-C2.4)
on:
  pull_request:
    paths:
      - "quality/grade11-unit06-v94c2-topic64-detailed-qc.md"
      - "scripts/test_grade11_unit06_topic64_academic_v94c2.cjs"
      - ".github/workflows/validate-grade11-unit06-topic64-academic-v94c2.yml"
  push:
    branches: [main]
    paths:
      - "quality/grade11-unit06-v94c2-topic64-detailed-qc.md"
      - "scripts/test_grade11_unit06_topic64_academic_v94c2.cjs"
      - ".github/workflows/validate-grade11-unit06-topic64-academic-v94c2.yml"
  workflow_dispatch:
jobs:
  topic64-independent-continuity-review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check audit test syntax
        run: node --check scripts/test_grade11_unit06_topic64_academic_v94c2.cjs
      - name: Recalculate Topic 6.4 B/C/D continuity problems and public-bank invariants
        run: node scripts/test_grade11_unit06_topic64_academic_v94c2.cjs
