name: Grade XI V160 Teacher Deployment Architecture NO-GO (OFFLINE)
on:
  pull_request:
    paths:
      - "quality/unit07/topic71-v160-production-readiness-no-go.json"
      - "quality/grade11-v160-teacher-deployment-security-architecture.md"
      - "scripts/audit_grade11_v160_teacher_deployment_no_go.cjs"
      - ".github/workflows/validate-grade11-v160-teacher-deployment-no-go.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/topic71-v160-production-readiness-no-go.json"
      - "quality/grade11-v160-teacher-deployment-security-architecture.md"
      - "scripts/audit_grade11_v160_teacher_deployment_no_go.cjs"
      - ".github/workflows/validate-grade11-v160-teacher-deployment-no-go.yml"
  workflow_dispatch:
jobs:
  fail-closed-production-teacher-no-go-until-owner-security-approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check offline teacher production NO-GO audit
        run: node --check scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
      - name: Verify all 12 production security gates stay blocked
        run: node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
      - name: Preserve all 80 Unit7 teacher pending academic reviews
        run: node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve unchanged 2250 original Grade XI provisional source identities
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve Unit6 560 academic teacher signoff HOLD
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve latest App Check reporting launch lock
        run: node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Preserve four registered browser App Check entrypoints unchanged
        run: node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
      - name: Preserve published private Firestore Rules snapshot self-test safeguards
        run: node scripts/test_grade11_published_rules_snapshot_v99t.cjs
      - name: Preserve earlier reporting readiness source truth
        run: node scripts/audit_grade11_review_launch_readiness_v100j.cjs
      - name: Upload metadata-only 12-gate NO-GO record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v160-teacher-deployment-security-no-go
          path: qa-artifacts/grade11-v160-teacher-production-readiness/summary.json
          if-no-files-found: warn
          retention-days: 14
