name: Grade XI Local Server-Only Administrator MCQ Review Reader (V99-P)
on:
  pull_request:
    paths:
      - "server/local-admin-review-reader-v99p.cjs"
      - "scripts/test_grade11_admin_review_reader_v99p.cjs"
      - "security-proposals/v99p/server-only-admin-queue-isolated.rules"
      - "server/firebase-review-emulator-v99f.cjs"
      - "server/verified-report-boundary-v99g.cjs"
      - "server/pinned-approved-review-catalog-v99i.cjs"
      - "server/review-manifests/grade11-approved-public-review-refs-v99i.json"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-admin-review-reader-v99p.yml"
  push:
    branches: [main]
    paths:
      - "server/local-admin-review-reader-v99p.cjs"
      - "scripts/test_grade11_admin_review_reader_v99p.cjs"
      - "security-proposals/v99p/server-only-admin-queue-isolated.rules"
      - "server/firebase-review-emulator-v99f.cjs"
      - "server/verified-report-boundary-v99g.cjs"
      - "server/pinned-approved-review-catalog-v99i.cjs"
      - "server/review-manifests/grade11-approved-public-review-refs-v99i.json"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-admin-review-reader-v99p.yml"
  workflow_dispatch:
jobs:
  local-admin-authorized-read-only-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GCLOUD_PROJECT: demo-psn-v99f-firestore
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check strictly local review reader and tests
        run: |
          node --check server/local-admin-review-reader-v99p.cjs
          node --check scripts/test_grade11_admin_review_reader_v99p.cjs
      - name: Install pinned Firebase SDKs and two local emulators
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase-admin@14.3.0 firebase@13.4.0
          @firebase/rules-unit-testing@6.0.0 firebase-tools@15.37.0
      - name: Verify real demo Auth claims and server-only Firestore report reads
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v99f-firestore
          "node scripts/test_grade11_admin_review_reader_v99p.cjs"
      - name: Upload only synthetic role and count verification, no account identifiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-admin-review-reader-v99p-evidence
          path: qa-artifacts/admin-review-reader-v99p/summary.json
          if-no-files-found: warn
          retention-days: 14
