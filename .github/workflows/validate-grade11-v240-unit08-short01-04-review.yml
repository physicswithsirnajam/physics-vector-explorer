name: Grade XI V240 Unit 8 Original Short Questions 8.1-8.4 Review
on:
  pull_request:
    paths:
      - "quality/unit08/unit08-v240-short01-04-review-no-answers.json"
      - "quality/unit08/unit08-v240-short01-04-academic-triage.md"
      - "scripts/test_grade11_v240_unit08_short01_04_review.cjs"
      - ".github/workflows/validate-grade11-v240-unit08-short01-04-review.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit08/unit08-v240-short01-04-review-no-answers.json"
      - "quality/unit08/unit08-v240-short01-04-academic-triage.md"
      - "scripts/test_grade11_v240_unit08_short01_04_review.cjs"
      - ".github/workflows/validate-grade11-v240-unit08-short01-04-review.yml"
jobs:
  original-short-questions-source-review-no-student-answers:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check review-only source metadata and test script syntax
        run: |
          node --check scripts/test_grade11_v240_unit08_short01_04_review.cjs
          node -e "JSON.parse(require('fs').readFileSync('quality/unit08/unit08-v240-short01-04-review-no-answers.json','utf8'))"
      - name: V240 original short Q8.1-8.4, scientific qualifications, source SLOs and assessment holds
        run: node scripts/test_grade11_v240_unit08_short01_04_review.cjs
      - name: Preserve V239 last six original Unit8 end MCQ academic reviews
        run: node scripts/test_grade11_v239_unit08_end_mcq13_18_review.cjs
      - name: Preserve V238 original MCQs 7-12 academic review
        run: node scripts/test_grade11_v238_unit08_end_mcq07_12_review.cjs
      - name: Preserve V237 original MCQs 1-6 academic review
        run: node scripts/test_grade11_v237_unit08_end_mcq01_06_review.cjs
      - name: Preserve V235 full 50-item original exercise inventory
        run: node scripts/test_grade11_v235_unit08_exercise_inventory.cjs
      - name: Preserve V224 source NBF textbook and official FBISE framework baseline
        run: node scripts/test_grade11_v224_unit8_original_source_slo_manifest.cjs
      - name: Preserve exact pinned 2250 Units1-6 MCQ IDs, choices and keys
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
