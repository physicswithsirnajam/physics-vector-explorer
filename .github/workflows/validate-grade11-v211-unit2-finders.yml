name: Grade XI V211 Unit 2 Source-Indexed Question Finder Navigation
on:
  pull_request:
    paths:
      - "shared/navigation.js"
      - "portal/unit-02.html"
      - "scripts/test_grade11_v211_unit2_finders.cjs"
      - "quality/grade11-v211-unit2-question-navigation-source-audit.md"
      - ".github/workflows/validate-grade11-v211-unit2-finders.yml"
  push:
    branches: [main]
    paths:
      - "shared/navigation.js"
      - "portal/unit-02.html"
      - "scripts/test_grade11_v211_unit2_finders.cjs"
      - ".github/workflows/validate-grade11-v211-unit2-finders.yml"
jobs:
  verify-unit2-finder-safety-and-browser-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate test syntax and original source catalogues
        run: |
          node --check shared/navigation.js
          node --check scripts/test_grade11_v211_unit2_finders.cjs
          node -e "JSON.parse(require('fs').readFileSync('portal/verified-textbook-index-v103.json','utf8'));JSON.parse(require('fs').readFileSync('portal/verified-descriptive-index-v104.json','utf8'))"
      - name: Preserve all 2250 original current MCQs and keyed answers
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Install pinned Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install chromium
      - name: Confirm Unit 2 prefiltered numerical/short/comprehensive links across three widths
        run: node scripts/test_grade11_v211_unit2_finders.cjs
      - name: Preserve V208 Unit 1 source-separated navigation
        run: node scripts/test_grade11_v208_unit1_sidebar_finders.cjs
      - name: Preserve V210 Unit 1 in-chapter assignments navigation
        run: node scripts/test_grade11_v210_unit1_assignments.cjs
      - name: Preserve original V140 five-stage resource drawer behavior
        run: node scripts/test_grade11_v140_unit_aware_sidebar_browser.cjs
      - name: Upload metadata-only browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v211-unit2-finder-audit
          path: qa-artifacts/grade11-v211-unit2-finder-navigation/evidence.json
          if-no-files-found: warn
          retention-days: 14
