name: Validate Grade XI Unit 6 Topic 6.1 MCQ 1-20 Academic QC (V95-C2A)
on:
  pull_request:
    paths:
      - "quality/grade11-unit06-v95c2a-topic61-mcq01-20-academic-review.csv"
      - "quality/grade11-unit06-v95c2a-topic61-mcq01-20-academic-review.md"
      - "scripts/test_grade11_unit06_v95c2a_topic61_first20_academic.cjs"
      - ".github/workflows/validate-grade11-unit06-v95c2a-topic61-first20.yml"
  push:
    branches: [main]
    paths:
      - "quality/grade11-unit06-v95c2a-topic61-mcq01-20-academic-review.csv"
      - "quality/grade11-unit06-v95c2a-topic61-mcq01-20-academic-review.md"
      - "scripts/test_grade11_unit06_v95c2a_topic61_first20_academic.cjs"
      - ".github/workflows/validate-grade11-unit06-v95c2a-topic61-first20.yml"
  workflow_dispatch:
jobs:
  first20-source-answers-slo-rights-and-pending-approval:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: First 20 prepared-source-matched archived answers and teacher-review gates
        run: |
          node --check scripts/test_grade11_unit06_v95c2a_topic61_first20_academic.cjs
          node scripts/test_grade11_unit06_v95c2a_topic61_first20_academic.cjs
          node scripts/test_grade11_unit06_v95c1_balanced_assessment.cjs
          node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
          node scripts/test_grade11_unit06_v95b1_topic61_study.cjs
