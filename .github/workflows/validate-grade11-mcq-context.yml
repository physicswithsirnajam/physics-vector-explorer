name: Validate Grade XI MCQ Context
on:
  pull_request:
    paths:
      - "question-bank/grade-11/unit-*.json"
      - "scripts/check_grade11_mcq_context.py"
      - "scripts/audit_grade11_mcq_quality.py"
      - "practice-engine/index.html"
      - "scripts/test_grade11_mcq_issue_report.py"
      - ".github/workflows/validate-grade11-mcq-context.yml"
  push:
    branches:
      - main
    paths:
      - "question-bank/grade-11/unit-*.json"
      - "scripts/check_grade11_mcq_context.py"
      - "scripts/audit_grade11_mcq_quality.py"
      - "practice-engine/index.html"
      - "scripts/test_grade11_mcq_issue_report.py"
      - ".github/workflows/validate-grade11-mcq-context.yml"
  workflow_dispatch:
jobs:
  verify-grade11-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Validate MCQ contexts and complete stimulus sets
        run: python3 scripts/check_grade11_mcq_context.py
      - name: Validate practice engine JavaScript syntax
        run: python3 scripts/check_v18_syntax.py
      - name: Test student MCQ issue report safety
        run: python3 scripts/test_grade11_mcq_issue_report.py
      - name: Generate Grade XI teacher QC review report
        run: python3 scripts/audit_grade11_mcq_quality.py --markdown reports/grade11-mcq-qc.md --json reports/grade11-mcq-qc.json
      - name: Show teacher QC findings in the GitHub Actions summary
        if: always()
        run: if [ -f reports/grade11-mcq-qc.md ]; then cat reports/grade11-mcq-qc.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload teacher QC review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-mcq-quality-review
          path: |
            reports/grade11-mcq-qc.md
            reports/grade11-mcq-qc.json
          if-no-files-found: warn
