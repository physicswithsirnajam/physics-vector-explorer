name: Grade XI V148 Unit7 Topic7.1 Keyless Scientific First-Pass Review
on:
  pull_request:
    paths:
      - "quality/unit07/topic71-v148-science-first-pass-keyless-register.json"
      - "quality/grade11-v148-topic71-answer-qc-teacher-review.md"
      - "scripts/audit_grade11_unit7_topic71_science_v148.cjs"
      - ".github/workflows/validate-grade11-v148-unit7-science-review.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/topic71-v148-science-first-pass-keyless-register.json"
      - "quality/grade11-v148-topic71-answer-qc-teacher-review.md"
      - "scripts/audit_grade11_unit7_topic71_science_v148.cjs"
      - ".github/workflows/validate-grade11-v148-unit7-science-review.yml"
  workflow_dispatch:
jobs:
  verify-scientific-review-and-keep-student-release-held:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: V148 syntax
        run: node --check scripts/audit_grade11_unit7_topic71_science_v148.cjs
      - name: Verify 80 keyless first-pass academic decisions and source HOLD
        run: node scripts/audit_grade11_unit7_topic71_science_v148.cjs
      - name: Preserve V147 original source questions
        run: node scripts/audit_grade11_unit7_topic71_candidate_v147.cjs
      - name: Preserve V146 source fingerprint ledger
        run: node scripts/audit_grade11_unit7_topic71_source_v146.cjs
      - name: Preserve existing 2250 Grade XI provisional MCQ IDs
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve 560 Unit6 teacher-signoff pending statuses
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Upload metadata-only audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v148-keyless-science-first-pass-qa
          path: qa-artifacts/grade11-v148-unit7-topic71-science-first-pass/summary.json
          if-no-files-found: warn
          retention-days: 14
