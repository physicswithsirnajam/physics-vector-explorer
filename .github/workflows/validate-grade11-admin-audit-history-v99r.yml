name: Grade XI Local Authorized Admin Audit History (V99-R)
on:
  pull_request:
    paths:
      - "server/local-admin-audit-history-v99r.cjs"
      - "scripts/test_grade11_admin_audit_history_v99r.cjs"
      - "server/local-admin-review-transitions-v99q.cjs"
      - "server/local-admin-review-reader-v99p.cjs"
      - "server/firebase-review-emulator-v99f.cjs"
      - "server/verified-report-boundary-v99g.cjs"
      - "server/pinned-approved-review-catalog-v99i.cjs"
      - "server/review-manifests/grade11-approved-public-review-refs-v99i.json"
      - "security-proposals/v99q/triage-server-only-isolated.rules"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-admin-audit-history-v99r.yml"
  push:
    branches: [main]
    paths:
      - "server/local-admin-audit-history-v99r.cjs"
      - "scripts/test_grade11_admin_audit_history_v99r.cjs"
      - "server/local-admin-review-transitions-v99q.cjs"
      - "server/local-admin-review-reader-v99p.cjs"
      - "server/firebase-review-emulator-v99f.cjs"
      - "server/verified-report-boundary-v99g.cjs"
      - "server/pinned-approved-review-catalog-v99i.cjs"
      - "server/review-manifests/grade11-approved-public-review-refs-v99i.json"
      - "security-proposals/v99q/triage-server-only-isolated.rules"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-admin-audit-history-v99r.yml"
  workflow_dispatch:
jobs:
  local-admin-private-audit-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GCLOUD_PROJECT: demo-psn-v99f-firestore
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify local-only audit history code syntax
        run: |
          node --check server/local-admin-audit-history-v99r.cjs
          node --check scripts/test_grade11_admin_audit_history_v99r.cjs
      - name: Install pinned Firebase SDKs and localhost-only emulators
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase-admin@14.3.0 firebase@13.4.0
          @firebase/rules-unit-testing@6.0.0 firebase-tools@15.37.0
      - name: Verify authentic LOCAL Firebase Auth, audit consistency and browser denial
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v99f-firestore
          "node scripts/test_grade11_admin_audit_history_v99r.cjs"
      - name: Upload synthetic summary only (no tokens, notes, UIDs or records)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-admin-audit-history-v99r-evidence
          path: qa-artifacts/admin-audit-history-v99r/summary.json
          if-no-files-found: warn
          retention-days: 14
