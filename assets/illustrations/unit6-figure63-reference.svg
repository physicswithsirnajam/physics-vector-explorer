<title id="fig63title">Schematic V-shaped flight formation</title>
<desc id="fig63desc">One leading bird is followed by two diagonal lines of stylized birds, giving a V-shaped flock. The textbook notes that this arrangement can help reduce drag and energy expenditure for individual birds.</desc>
