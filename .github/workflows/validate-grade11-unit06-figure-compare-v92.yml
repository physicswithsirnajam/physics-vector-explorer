name: Validate Grade XI Unit6 Private Figure Comparison (V92)
on:
  pull_request:
    paths:
      - "portal/unit-06-figure-verification-v91.*"
      - "portal/unit-06-figure-study-v90.html"
      - "portal/index.html"
      - "scripts/test_unit06_local_figure_compare_v92.cjs"
      - "quality/grade11-unit06-v92-local-figure-comparison-audit.md"
      - ".github/workflows/validate-grade11-unit06-figure-compare-v92.yml"
  push:
    branches: [main]
    paths:
      - "portal/unit-06-figure-verification-v91.*"
      - "portal/unit-06-figure-study-v90.html"
      - "portal/index.html"
      - "scripts/test_unit06_local_figure_compare_v92.cjs"
      - "quality/grade11-unit06-v92-local-figure-comparison-audit.md"
      - ".github/workflows/validate-grade11-unit06-figure-compare-v92.yml"
  workflow_dispatch:
jobs:
  private-image-safety-and-390px-browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax, privacy and unchanged 2,250 central MCQ manifest
        run: |
          node --check portal/unit-06-figure-verification-v91.js
          node --check scripts/test_unit06_local_figure_compare_v92.cjs
          node -e "const m=require('./question-bank/manifest.json').grades.find(g=>g.grade===11).units;if(m[5].liveMcqCount!==560||m[5].sourceTopicMcqCount!==560||m[5].sourceFigureHeldCount!==0||m.reduce((n,u)=>n+u.liveMcqCount,0)!==2250)process.exit(1)"
      - name: Install Chromium for real private file input and mobile browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: V92 four-image local-only validation, zoom, privacy and screenshot checks
        run: node scripts/test_unit06_local_figure_compare_v92.cjs
      - name: Regression — V91 six original questions and local evidence record
        run: node scripts/test_unit06_figure_verification_v91.cjs
      - name: Regression — V90 independent conceptual figure drawings
        run: node scripts/test_unit06_figure_study_v90.cjs
      - name: Regression — V89 central 2,250 MCQs and V88 original Superfluidity bank
        run: |
          node scripts/test_grade11_unit06_central_v89.cjs
          node scripts/test_unit06_topic67_v88.cjs
      - name: Regression — original topic6.1–6.3 source holds and privacy
        run: |
          node scripts/test_unit06_topic61_v76.cjs
          node scripts/test_unit06_topic62_v78.cjs
          node scripts/test_unit06_topic63_v80.cjs
          node scripts/test_grade11_direct_youtube_v74.cjs
      - name: Upload V92 synthetic mobile browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v92-private-comparison-mobile390
          path: qa-artifacts/unit06-comparison-v92/*.png
          if-no-files-found: warn
          retention-days: 7
