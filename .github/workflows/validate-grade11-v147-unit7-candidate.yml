name: Grade XI V147 Unit7 Topic7.1 80 Question-Only Source Candidate
on:
  pull_request:
    paths:
      - "quality/unit07/topic71-v147-80-question-only-candidate.tsv"
      - "quality/grade11-v147-topic71-question-only-staging-teacher-review.md"
      - "scripts/audit_grade11_unit7_topic71_candidate_v147.cjs"
      - ".github/workflows/validate-grade11-v147-unit7-candidate.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/topic71-v147-80-question-only-candidate.tsv"
      - "quality/grade11-v147-topic71-question-only-staging-teacher-review.md"
      - "scripts/audit_grade11_unit7_topic71_candidate_v147.cjs"
      - ".github/workflows/validate-grade11-v147-unit7-candidate.yml"
  workflow_dispatch:
jobs:
  verify-80-source-derived-questions-zero-answer-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check candidate audit syntax
        run: node --check scripts/audit_grade11_unit7_topic71_candidate_v147.cjs
      - name: Verify exact 80 original-source questions 4 options and only two tracked proposed corrections
        run: node scripts/audit_grade11_unit7_topic71_candidate_v147.cjs
      - name: Preserve V146 source row fingerprints and all pending academic approvals
        run: node scripts/audit_grade11_unit7_topic71_source_v146.cjs
      - name: Preserve original 2250 Grade XI provisional MCQ IDs and source counts
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve 560 Unit6 pending teacher academic decisions and formal release hold
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Upload counts-only staging QA without questions or answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v147-unit7-80-question-only-candidate-qc
          path: qa-artifacts/grade11-v147-unit7-topic71-unscored-candidate/summary.json
          if-no-files-found: warn
          retention-days: 14
