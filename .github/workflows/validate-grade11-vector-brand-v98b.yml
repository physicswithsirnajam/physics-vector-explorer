name: Validate Grade XI Vector Explorer Official Logo (V98-B)
on:
  pull_request:
    paths:
      - "index.html"
      - "portal/assets/physics-with-sir-najam-official-logo.png"
      - "scripts/test_grade11_vector_explorer_brand_v98b.cjs"
      - ".github/workflows/validate-grade11-vector-brand-v98b.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "portal/assets/physics-with-sir-najam-official-logo.png"
      - "scripts/test_grade11_vector_explorer_brand_v98b.cjs"
      - ".github/workflows/validate-grade11-vector-brand-v98b.yml"
  workflow_dispatch:
jobs:
  original-vector-laboratory-branding-and-science-regression:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audit/test syntax
        run: node --check scripts/test_grade11_vector_explorer_brand_v98b.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Preserve original Vector Explorer physics and verify exact branded image on root and project GitHub Pages
        run: node scripts/test_grade11_vector_explorer_brand_v98b.cjs
      - name: Archive desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-vector-brand-v98b-screenshots
          path: qa-artifacts/vector-brand-v98b/*.png
          if-no-files-found: warn
          retention-days: 7
