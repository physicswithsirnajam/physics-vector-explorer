name: Grade XI V248 Unit 8 Original Numericals 8.7-8.9 Academic Review
on:
  pull_request:
    paths:
      - "quality/unit08/unit08-v248-numerical07-09-source-qc-no-approved-answers.json"
      - "quality/unit08/unit08-v248-numerical07-09-teacher-triage.md"
      - "scripts/test_grade11_v248_unit08_numerical07_09_review.cjs"
      - ".github/workflows/validate-grade11-v248-unit08-numerical07-09-review.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit08/unit08-v248-numerical07-09-source-qc-no-approved-answers.json"
      - "quality/unit08/unit08-v248-numerical07-09-teacher-triage.md"
      - "scripts/test_grade11_v248_unit08_numerical07_09_review.cjs"
      - ".github/workflows/validate-grade11-v248-unit08-numerical07-09-review.yml"
jobs:
  complete-original-numerical-source-review-no-graded-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source-review metadata and JavaScript syntax
        run: |
          node --check scripts/test_grade11_v248_unit08_numerical07_09_review.cjs
          node -e "JSON.parse(require('fs').readFileSync('quality/unit08/unit08-v248-numerical07-09-source-qc-no-approved-answers.json','utf8'))"
      - name: V248 recalculate source 8.7-8.9, preserve both P-V diagram subparts and all 50 original exercises
        run: node scripts/test_grade11_v248_unit08_numerical07_09_review.cjs
      - name: Preserve V247 original numericals 8.4-8.6 including source Carnot conflict
        run: node scripts/test_grade11_v247_unit08_numerical04_06_review.cjs
      - name: Preserve V246 original numericals 8.1-8.3 and underdetermination
        run: node scripts/test_grade11_v246_unit08_numerical01_03_review.cjs
      - name: Preserve V245 entropy/COP source textbook contradictions
        run: node scripts/test_grade11_v245_unit08_comprehensive09_11_review.cjs
      - name: Preserve V244 heat engine Second Law Carnot comprehensive review
        run: node scripts/test_grade11_v244_unit08_comprehensive05_07_review.cjs
      - name: Preserve V243 first four comprehensive source questions
        run: node scripts/test_grade11_v243_unit08_comprehensive01_04_review.cjs
      - name: Preserve V242 completed short-response 13-item source QC
        run: node scripts/test_grade11_v242_unit08_short09_13_review.cjs
      - name: Preserve V241 original short 8.5-8.8 source QC
        run: node scripts/test_grade11_v241_unit08_short05_08_review.cjs
      - name: Preserve V240 original short 8.1-8.4 source QC
        run: node scripts/test_grade11_v240_unit08_short01_04_review.cjs
      - name: Preserve V239 original MCQs 13-18 source QC
        run: node scripts/test_grade11_v239_unit08_end_mcq13_18_review.cjs
      - name: Preserve V238 original MCQs 7-12 source QC
        run: node scripts/test_grade11_v238_unit08_end_mcq07_12_review.cjs
      - name: Preserve V237 original MCQs 1-6 source QC
        run: node scripts/test_grade11_v237_unit08_end_mcq01_06_review.cjs
      - name: Preserve V235 full 50-item original exercise inventory
        run: node scripts/test_grade11_v235_unit08_exercise_inventory.cjs
      - name: Preserve V224 original NBF textbook and official FBISE summative framework
        run: node scripts/test_grade11_v224_unit8_original_source_slo_manifest.cjs
      - name: Preserve exact pinned 2250 Units1-6 MCQ IDs options answer keys
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
