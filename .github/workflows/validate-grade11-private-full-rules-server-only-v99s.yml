name: Grade XI Private Full-Policy Server-Only Review Gate (V99-S)
on:
  pull_request:
    paths:
      - "scripts/test_grade11_private_full_rules_server_only_v99s.cjs"
      - "practice-engine/index.html"
      - "security-proposals/v99c/emulator-only.json"
      - ".github/workflows/validate-grade11-private-full-rules-server-only-v99s.yml"
  push:
    branches: [main]
    paths:
      - "scripts/test_grade11_private_full_rules_server_only_v99s.cjs"
      - "practice-engine/index.html"
      - "security-proposals/v99c/emulator-only.json"
      - ".github/workflows/validate-grade11-private-full-rules-server-only-v99s.yml"
  workflow_dispatch:
jobs:
  private-owner-baseline-compatibility-server-only-denials:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GCLOUD_PROJECT: demo-psn-v99s-private-full-rules
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check no-deploy private full-policy regression script syntax
        run: node --check scripts/test_grade11_private_full_rules_server_only_v99s.cjs
      - name: Require owner-supplied private policy secret; never substitute an isolated fixture
        env:
          PSN_FIRESTORE_BASELINE_RULES: ${{ secrets.PSN_FIRESTORE_BASELINE_RULES }}
        run: |
          if [ -z "$PSN_FIRESTORE_BASELINE_RULES" ]; then
            echo "::error::Private owner baseline is missing. Halt; no invented or public rules fallback."
            exit 1
          fi
          echo "Private baseline configured; contents not printed."
      - name: Install pinned local-only Firebase rules emulator dependencies
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase@13.4.0 @firebase/rules-unit-testing@6.0.0
          firebase-tools@15.37.0
      - name: Test complete private baseline plus additive server-only deny blocks
        env:
          PSN_FIRESTORE_BASELINE_RULES: ${{ secrets.PSN_FIRESTORE_BASELINE_RULES }}
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99c/emulator-only.json
          --only firestore
          --project demo-psn-v99s-private-full-rules
          "node scripts/test_grade11_private_full_rules_server_only_v99s.cjs"
      - name: Upload counts-only synthetic audit, never the private rules source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-private-full-rules-v99s-compatibility-evidence
          path: qa-artifacts/private-full-rules-v99s/summary.json
          if-no-files-found: warn
          retention-days: 14
