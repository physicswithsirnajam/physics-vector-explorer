name: Grade XI V203 Unit7.2 Twelve Additional Original Modulus/Strain MCQs (HOLD)
on:
  pull_request:
    paths:
      - "quality/unit07/unit07-v203-topic72-twelve-elastic-modulus-source-qc-no-keys.json"
      - "quality/grade11-v203-unit07-topic72-twelve-elastic-modulus-source-slo-qc.md"
      - "scripts/audit_grade11_unit07_topic72_next12_v203.cjs"
      - "scripts/test_grade11_unit07_topic72_math_v203.cjs"
      - ".github/workflows/validate-grade11-v203-topic72-next12-source-slo.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/unit07-v203-topic72-twelve-elastic-modulus-source-qc-no-keys.json"
      - "quality/grade11-v203-unit07-topic72-twelve-elastic-modulus-source-slo-qc.md"
      - "scripts/audit_grade11_unit07_topic72_next12_v203.cjs"
      - "scripts/test_grade11_unit07_topic72_math_v203.cjs"
      - ".github/workflows/validate-grade11-v203-topic72-next12-source-slo.yml"
  workflow_dispatch:
jobs:
  verify-exact-original-source-and-keep-grading-held:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check V203 academic source and mechanics code
        run: |
          node --check scripts/audit_grade11_unit07_topic72_next12_v203.cjs
          node --check scripts/test_grade11_unit07_topic72_math_v203.cjs
      - name: Verify original 12 Topic7.2 row hashes, separate queues and all score holds
        run: node scripts/audit_grade11_unit07_topic72_next12_v203.cjs
      - name: Recheck SI moduli, stress, strain, load ratios and proportional limit
        run: node scripts/test_grade11_unit07_topic72_math_v203.cjs
      - name: Preserve V202 12 distinct Topic7.2 source review and Fig7.12 science
        run: |
          node scripts/audit_grade11_unit07_topic72_next12_v202.cjs
          node scripts/test_grade11_unit07_topic72_physics_v202.cjs
      - name: Preserve V201 Topic7.3 source and work-energy calculations
        run: |
          node scripts/audit_grade11_unit07_topic73_next12_v201.cjs
          node scripts/test_grade11_unit07_topic73_energy_math_v201.cjs
      - name: Preserve V200/V199 distinct original Topic7.1 source identities
        run: |
          node scripts/audit_grade11_unit07_topic71_next12_v200.cjs
          node scripts/audit_grade11_unit07_topic71_secondpass_v199.cjs
      - name: Preserve V198 prior Topic7.2 source identities and elastic math
        run: |
          node scripts/audit_grade11_unit07_topic72_secondpass_v198.cjs
          node scripts/test_grade11_unit07_topic72_math_v198.cjs
      - name: Preserve V197 prior Topic7.3 source identities and elastic-energy maths
        run: |
          node scripts/audit_grade11_unit07_topic73_secondpass_v197.cjs
          node scripts/test_grade11_unit07_topic73_math_v197.cjs
      - name: Preserve original three 80-row Unit7 source banks
        run: |
          node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
          node scripts/audit_grade11_unit7_topic72_bank_v168.cjs
          node scripts/audit_grade11_unit7_topic73_bank_v173.cjs
      - name: Preserve V196 numerical SI/graph regression
        run: node scripts/test_grade11_unit07_numerical_scaling_v196.cjs
      - name: Preserve V195 unsigned teacher decisions, V194 worked and V193 source math
        run: |
          node scripts/audit_grade11_unit07_teacher_decision_pack_v195.cjs
          node scripts/audit_grade11_unit07_teacher_solution_qc_v194.cjs
          node scripts/audit_grade11_unit07_original_pdf_source_v193.cjs
      - name: Preserve V192 science and V191/V190 offline decision denials
        run: |
          node scripts/audit_grade11_unit07_q25_disposition_v192.cjs
          node scripts/test_grade11_unit07_offline_review_evidence_v191.cjs
          node scripts/test_grade11_unit07_revision_bound_review_v190.cjs
      - name: Preserve source 274 and V185 72 privately drafted teacher-approval HOLD
        run: |
          node scripts/audit_grade11_unit07_teacher_readiness_v185.cjs
          node scripts/audit_grade11_unit07_teacher_approval_index_v178.cjs
      - name: Preserve 2250 prior Grade XI source-pinned MCQs and Unit6 560 pending signoffs
        run: |
          node scripts/test_grade11_pinned_review_catalog_v99i.cjs
          node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve V160/V161 backend production and staging NO-GO
        run: |
          node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
          node scripts/audit_grade11_v161_staging_callable_contract.cjs
      - name: Preserve App Check, browser reporting and scored launch locks
        run: |
          node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
          node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Upload non-keyed audit counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v203-unit7-topic72-original12-math-no-score
          path: qa-artifacts/grade11-v203-topic72-next12-original-qc/summary.json
          if-no-files-found: warn
          retention-days: 14
