name: Grade XI V157 Local Teacher Review POST Security (ADVISORY ONLY)
on:
  pull_request:
    paths:
      - "server/local-topic71-teacher-action-http-v157.cjs"
      - "scripts/test_grade11_v157_local_teacher_http.cjs"
      - "quality/grade11-v157-local-teacher-recommendation-http-pilot.md"
      - ".github/workflows/validate-grade11-v157-unit7-teacher-http.yml"
  push:
    branches: [main]
    paths:
      - "server/local-topic71-teacher-action-http-v157.cjs"
      - "scripts/test_grade11_v157_local_teacher_http.cjs"
      - "quality/grade11-v157-local-teacher-recommendation-http-pilot.md"
      - ".github/workflows/validate-grade11-v157-unit7-teacher-http.yml"
  workflow_dispatch:
jobs:
  local-authenticated-post-with-no-score-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-psn-v143-classrooms
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      PSN_LOCAL_TOPIC71_TEACHER_ACTION_HTTP: enabled-local-test-only
      PSN_LOCAL_TOPIC71_TEACHER_PREVIEW: enabled-local-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax-check V157 local action and integration tests
        run: |
          node --check server/local-topic71-teacher-action-http-v157.cjs
          node --check scripts/test_grade11_v157_local_teacher_http.cjs
          node --check server/local-topic71-teacher-review-pilot-v155.cjs
          node --check server/local-topic71-teacher-preview-v156.cjs
      - name: All 80 Unit7 source MCQs retain original academic HOLD
        run: node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve Grade XI original 2250 provisional MCQ IDs
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve Unit6 560 teacher academic decisions pending
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve original published private Rules snapshot attestation
        run: node scripts/test_grade11_published_rules_snapshot_v99t.cjs
      - name: Install pinned LOCAL emulator dependencies
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase-admin@14.3.0 firebase@13.4.0
          @firebase/rules-unit-testing@6.0.0 firebase-tools@15.37.0
      - name: Test V157 real local Firebase teacher POST actions and read-only preview refresh
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v143-classrooms
          "node scripts/test_grade11_v157_local_teacher_http.cjs"
      - name: Preserve V156 authenticated preview and no-browser-CORS boundaries
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v143-classrooms
          "node scripts/test_grade11_v156_local_teacher_readonly_preview.cjs"
      - name: Preserve V155 teacher-only review and Firestore browser denials
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v143-classrooms
          "node scripts/test_grade11_v155_local_topic71_teacher_review.cjs"
      - name: Upload synthetic aggregate counts only without identities or answer keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v157-unit7-local-teacher-recommendation-http
          path: |
            qa-artifacts/grade11-v157-unit7-local-teacher-http/summary.json
            qa-artifacts/grade11-v156-topic71-authenticated-readonly-preview/summary.json
            qa-artifacts/grade11-v155-unit7-local-teacher-review/summary.json
          if-no-files-found: warn
          retention-days: 14
