name: Grade XI App Check Reporting Launch Lock (V99-U)
on:
  pull_request:
    paths:
      - "practice-engine/index.html"
      - "portal/**"
      - "shared/**"
      - "server/**"
      - "functions/**"
      - "cloud-functions/**"
      - "cloud-run/**"
      - "firebase.json"
      - "firestore.rules"
      - ".firebaserc"
      - ".github/workflows/**"
      - "scripts/audit_grade11_reporting_launch_lock_v99u.cjs"
      - "scripts/test_grade11_reporting_launch_lock_v99u.cjs"
  push:
    branches: [main]
    paths:
      - "practice-engine/index.html"
      - "portal/**"
      - "shared/**"
      - "server/**"
      - "functions/**"
      - "cloud-functions/**"
      - "cloud-run/**"
      - "firebase.json"
      - "firestore.rules"
      - ".firebaserc"
      - ".github/workflows/**"
      - "scripts/audit_grade11_reporting_launch_lock_v99u.cjs"
      - "scripts/test_grade11_reporting_launch_lock_v99u.cjs"
  workflow_dispatch:
jobs:
  no-live-mcq-sender-until-genuine-appcheck-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check source-only no-deploy launch lock
        run: |
          node --check scripts/audit_grade11_reporting_launch_lock_v99u.cjs
          node --check scripts/test_grade11_reporting_launch_lock_v99u.cjs
      - name: Exercise regression injection against report and App Check boundaries
        run: node scripts/test_grade11_reporting_launch_lock_v99u.cjs
      - name: "Audit real checkout: copy-only student UI and explicit demo/OFF gates"
        run: node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Upload counts-only launch-blocker summary, no account or secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-appcheck-launch-lock-v99u
          path: qa-artifacts/appcheck-launch-lock-v99u/summary.json
          if-no-files-found: warn
          retention-days: 14
