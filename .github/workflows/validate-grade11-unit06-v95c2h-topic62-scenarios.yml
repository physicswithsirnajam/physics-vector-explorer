name: Validate Grade XI Unit 6 Topic 6.2 MCQ 61-80 Scenario QC (V95-C2H)
on:
  pull_request:
    paths:
      - "quality/grade11-unit06-v95c2h-topic62-mcq61-80-scenario-review.csv"
      - "quality/grade11-unit06-v95c2h-topic62-mcq61-80-scenario-review.md"
      - "scripts/test_grade11_unit06_v95c2h_topic62_last20_scenarios.cjs"
      - ".github/workflows/validate-grade11-unit06-v95c2h-topic62-scenarios.yml"
  push:
    branches: [main]
    paths:
      - "quality/grade11-unit06-v95c2h-topic62-mcq61-80-scenario-review.csv"
      - "quality/grade11-unit06-v95c2h-topic62-mcq61-80-scenario-review.md"
      - "scripts/test_grade11_unit06_v95c2h_topic62_last20_scenarios.cjs"
      - ".github/workflows/validate-grade11-unit06-v95c2h-topic62-scenarios.yml"
  workflow_dispatch:
jobs:
  topic62-last20-scenario-source-keys-and-teacher-holds:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 20 standalone scenarios, 2 figure refs, six teacher conditions and inherited QC
        run: |
          node --check scripts/test_grade11_unit06_v95c2h_topic62_last20_scenarios.cjs
          node scripts/test_grade11_unit06_v95c2h_topic62_last20_scenarios.cjs
          node scripts/test_grade11_unit06_v95c2g_topic62_num41_60_academic.cjs
          node scripts/test_grade11_unit06_v95c2f_topic62_second20_academic.cjs
          node scripts/test_grade11_unit06_v95c2e_topic62_first20_academic.cjs
          node scripts/test_grade11_unit06_v95c2d_topic61_scenarios.cjs
          node scripts/test_grade11_unit06_v95c2c_topic61_mcq41_64_numerical.cjs
          node scripts/test_grade11_unit06_v95c2b_topic61_mcq21_40_academic.cjs
          node scripts/test_grade11_unit06_v95c2a_topic61_first20_academic.cjs
          node scripts/test_grade11_unit06_v95c1_balanced_assessment.cjs
          node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
