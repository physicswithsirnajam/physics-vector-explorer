name: Grade XI V226 Unit 8 Topic 8.2 Kinetic Gas and Work
on:
  pull_request:
    paths:
      - "portal/unit-08-topic82-kinetic-gases-work-v226.html"
      - "portal/learning-catalog.json"
      - "portal/exam-quick-access.html"
      - "shared/navigation.js"
      - "scripts/test_grade11_v226_unit8_topic82_source_browser.cjs"
      - "quality/grade11-v226-unit8-topic82-source-work-science.md"
      - ".github/workflows/validate-grade11-v226-unit8-topic82.yml"
  push:
    branches: [main]
    paths:
      - "portal/unit-08-topic82-kinetic-gases-work-v226.html"
      - "portal/learning-catalog.json"
      - "portal/exam-quick-access.html"
      - "shared/navigation.js"
      - "scripts/test_grade11_v226_unit8_topic82_source_browser.cjs"
      - ".github/workflows/validate-grade11-v226-unit8-topic82.yml"
jobs:
  nbf-source-kinetic-theory-work-signs-and-unscored-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source test and sidebar JS, plus canonical JSON
        run: |
          node --check shared/navigation.js
          node --check scripts/test_grade11_v226_unit8_topic82_source_browser.cjs
          node -e "JSON.parse(require('fs').readFileSync('portal/learning-catalog.json','utf8'));JSON.parse(require('fs').readFileSync('quality/unit08/unit08-v224-original-textbook-source-slo-inventory-no-keys.json','utf8'))"
      - name: Preserve 2250 original Units1-6 student MCQ ids, choices and keys
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Install pinned headless Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install chromium
      - name: V226 original 8.2 source scientific SI check, actual 1280/390/320 browser and signs
        run: node scripts/test_grade11_v226_unit8_topic82_source_browser.cjs
      - name: Preserve V225 original Topic 8.1 sidebar, working Example and Assignment
        run: node scripts/test_grade11_v225_unit8_topic81_source_browser.cjs
      - name: Preserve V224 27-page Unit8 and FBISE SLO source manifest
        run: node scripts/test_grade11_v224_unit8_original_source_slo_manifest.cjs
      - name: Preserve V209 Unit7 lessons and original hold
        run: node scripts/test_grade11_v209_unit7_learning_discovery.cjs
      - name: Preserve V140 unit-aware global sidebar and future-unit boundaries
        run: node scripts/test_grade11_v140_unit_aware_sidebar_browser.cjs
      - name: Archive anonymous student-browser check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v226-unit08-topic82-work-sign-browser
          path: qa-artifacts/grade11-v226-unit08-topic82-source-browser/evidence.json
          if-no-files-found: warn
          retention-days: 14
