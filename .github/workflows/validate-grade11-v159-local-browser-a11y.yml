name: Grade XI V159 Real Chromium Local Teacher Review UI and Accessibility (HOLD)
on:
  pull_request:
    paths:
      - "server/local-topic71-browser-review-v158.cjs"
      - "local-dev/topic71-teacher-review-v158.js"
      - "scripts/test_grade11_v159_local_chromium_teacher_review.cjs"
      - "quality/grade11-v159-local-teacher-chromium-accessibility-qc.md"
      - ".github/workflows/validate-grade11-v159-local-browser-a11y.yml"
  push:
    branches: [main]
    paths:
      - "server/local-topic71-browser-review-v158.cjs"
      - "local-dev/topic71-teacher-review-v158.js"
      - "scripts/test_grade11_v159_local_chromium_teacher_review.cjs"
      - "quality/grade11-v159-local-teacher-chromium-accessibility-qc.md"
      - ".github/workflows/validate-grade11-v159-local-browser-a11y.yml"
  workflow_dispatch:
jobs:
  native-chromium-actual-teacher-ui-a11y-and-academic-holds:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-psn-v143-classrooms
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      PSN_LOCAL_TOPIC71_BROWSER_REVIEW: enabled-local-test-only
      PSN_LOCAL_TOPIC71_TEACHER_PREVIEW: enabled-local-test-only
      PSN_LOCAL_TOPIC71_TEACHER_ACTION_HTTP: enabled-local-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax-check local teacher browser source, UI and real Chromium tests
        run: |
          node --check server/local-topic71-browser-review-v158.cjs
          node --check local-dev/topic71-teacher-review-v158.js
          node --check scripts/test_grade11_v159_local_chromium_teacher_review.cjs
      - name: Retain 80 source-bound Unit7 teacher academic HOLD
        run: node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Retain 2250 original Grade XI provisional source question identities
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Retain Unit6 560 pending teacher academic approvals
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Retain private owner published-Firestore-Rules attestation safety
        run: node scripts/test_grade11_published_rules_snapshot_v99t.cjs
      - name: Install pinned Chromium, axe and LOCAL Firebase SDK/emulators
        run: |
          npm install --no-save --no-package-lock --ignore-scripts \
            firebase-admin@14.3.0 firebase@13.4.0 \
            @firebase/rules-unit-testing@6.0.0 firebase-tools@15.37.0 \
            playwright@1.56.0 axe-core@4.10.3
          npx playwright install chromium
      - name: Exercise real Chromium teacher login, keyboard submission, mobile, WCAG and revocations
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v143-classrooms
          "node scripts/test_grade11_v159_local_chromium_teacher_review.cjs"
      - name: Preserve V158 signed teacher HTTP source and same-origin protection tests
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v143-classrooms
          "node scripts/test_grade11_v158_local_browser_review.cjs"
      - name: Preserve V155 server tenant isolation and direct-browser Firestore denials
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v143-classrooms
          "node scripts/test_grade11_v155_local_topic71_teacher_review.cjs"
      - name: Upload synthetic browser screenshots and aggregate QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v159-local-native-chromium-teacher-review-qc
          path: |
            qa-artifacts/grade11-v159-local-chromium-teacher-review/
            qa-artifacts/grade11-v158-local-browser-review/summary.json
          if-no-files-found: warn
          retention-days: 14
