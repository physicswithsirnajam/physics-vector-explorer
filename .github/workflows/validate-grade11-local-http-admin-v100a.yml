name: Grade XI Local HTTP Administrator Review Queue (V100-A)
on:
  pull_request:
    paths:
      - "server/local-http-admin-review-v100a.cjs"
      - "server/local-admin-review-reader-v99p.cjs"
      - "server/local-admin-account-freshness-v99y.cjs"
      - "scripts/test_grade11_local_http_admin_review_v100a.cjs"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-local-http-admin-v100a.yml"
  push:
    branches: [main]
    paths:
      - "server/local-http-admin-review-v100a.cjs"
      - "server/local-admin-review-reader-v99p.cjs"
      - "server/local-admin-account-freshness-v99y.cjs"
      - "scripts/test_grade11_local_http_admin_review_v100a.cjs"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-local-http-admin-v100a.yml"
  workflow_dispatch:
jobs:
  localhost-only-admin-review-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-psn-v99f-firestore
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      PSN_LOCAL_ADMIN_HTTP_REHEARSAL: enabled-local-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax check strictly local HTTP and genuine Firebase test modules
        run: |
          node --check server/local-http-admin-review-v100a.cjs
          node --check scripts/test_grade11_local_http_admin_review_v100a.cjs
      - name: Install pinned local Firebase SDKs and emulators only
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase-admin@14.3.0 firebase@13.4.0 firebase-tools@15.37.0
      - name: Rehearse admin HTTP GET with real signed emulator tokens and private-field denial
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v99f-firestore
          "node scripts/test_grade11_local_http_admin_review_v100a.cjs"
      - name: Archive synthetic pass/fail labels only, no tokens or private records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-local-http-admin-review-v100a-evidence
          path: qa-artifacts/local-admin-http-v100a/summary.json
          if-no-files-found: warn
          retention-days: 14
