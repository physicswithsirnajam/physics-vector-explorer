name: Grade XI Real Firestore Emulator Report Adapter (V99-F)
on:
  pull_request:
    paths:
      - "server/firebase-review-emulator-v99f.cjs"
      - "server/mcq-review-intake-v99e.cjs"
      - "shared/mcq-review-contract-v99a.js"
      - "scripts/test_grade11_firestore_adapter_v99f.cjs"
      - "security-proposals/v99c/emulator-only.json"
      - "security-proposals/v99c/mcq-review-isolated.rules"
      - ".github/workflows/validate-grade11-firestore-review-adapter-v99f.yml"
  push:
    branches: [main]
    paths:
      - "server/firebase-review-emulator-v99f.cjs"
      - "server/mcq-review-intake-v99e.cjs"
      - "shared/mcq-review-contract-v99a.js"
      - "scripts/test_grade11_firestore_adapter_v99f.cjs"
      - "security-proposals/v99c/emulator-only.json"
      - "security-proposals/v99c/mcq-review-isolated.rules"
      - ".github/workflows/validate-grade11-firestore-review-adapter-v99f.yml"
  workflow_dispatch:
jobs:
  firebase-admin-transactions-local-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GCLOUD_PROJECT: demo-psn-v99f-firestore
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax-check no-deployment Firestore transaction bridge and tests
        run: |
          node --check server/firebase-review-emulator-v99f.cjs
          node --check scripts/test_grade11_firestore_adapter_v99f.cjs
      - name: Install pinned Firebase Admin, client test SDK and local emulators
        run: |
          npm install --no-save --no-package-lock --ignore-scripts firebase-admin@14.3.0 firebase@13.4.0 @firebase/rules-unit-testing@6.0.0 firebase-tools@15.37.0
      - name: Exercise real Admin SDK transactions and blocked browser access in local demo project
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99c/emulator-only.json
          --only firestore
          --project demo-psn-v99f-firestore
          "node scripts/test_grade11_firestore_adapter_v99f.cjs"
      - name: Preserve synthetic integration results only even if failing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-firestore-review-v99f-evidence
          path: qa-artifacts/firestore-review-adapter-v99f/
          if-no-files-found: warn
          retention-days: 14
