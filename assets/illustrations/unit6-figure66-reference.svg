<svg role="img" aria-labelledby="fig66title fig66desc" viewBox="0 0 760 325" xmlns="http://www.w3.org/2000/svg">
<title id="fig66title">Two flow patterns in pipes</title>
<desc id="fig66desc">Panel a on the left shows smooth parallel noncrossing paths flowing from left to right, labelled streamline flow. Panel b on the right shows irregular swirling particle paths and eddies inside a horizontal pipe, labelled turbulent flow.</desc>
