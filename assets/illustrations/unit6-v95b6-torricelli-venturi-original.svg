<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" role="img" aria-labelledby="t d">
<title id="t">Original schematic comparing a Torricelli tank outlet and a Venturi tube</title>
<desc id="d">On the left a large open water tank has a free surface above a small outlet; the vertical difference H between surface and opening gives ideal exit speed v equals square root of 2gH, assuming equal air pressures, negligible surface speed and no loss. On the right, a Venturi channel narrows to a throat: A1 larger than A2, v2 larger than v1, and static P2 lower than P1 in the horizontal ideal model. Two same-liquid pressure tubes show an inlet-to-throat height difference H; the difference is not a differential two-fluid manometer reading. Drawings are original, diagrammatic and not NBF textbook figures.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path fill="#157fa3" d="M0 0 L10 5 L0 10 Z"/></marker></defs>
