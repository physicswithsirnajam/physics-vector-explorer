name: Validate Grade XI Unit6 Figure Study and Holds (V90)
on:
  pull_request:
    paths:
      - "portal/unit-06-figure-study-v90.html"
      - "portal/index.html"
      - "portal/unit-06-topic-61-preview.html"
      - "portal/unit-06-topic-62-preview.html"
      - "portal/unit-06-topic-63-preview.html"
      - "scripts/test_unit06_figure_study_v90.cjs"
      - "quality/grade11-unit06-v90-figure-hold-evidence.md"
      - ".github/workflows/validate-grade11-unit06-figure-study-v90.yml"
  push:
    branches: [main]
    paths:
      - "portal/unit-06-figure-study-v90.html"
      - "portal/index.html"
      - "portal/unit-06-topic-61-preview.html"
      - "portal/unit-06-topic-62-preview.html"
      - "portal/unit-06-topic-63-preview.html"
      - "scripts/test_unit06_figure_study_v90.cjs"
      - "quality/grade11-unit06-v90-figure-hold-evidence.md"
      - ".github/workflows/validate-grade11-unit06-figure-study-v90.yml"
  workflow_dispatch:
jobs:
  held-figure-source-and-student-browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, 6 source holds, all 4 figure references, and unchanged 2,244 central MCQ count
        run: |
          node --check scripts/test_unit06_figure_study_v90.cjs
          node -e "const m=require('./question-bank/manifest.json').grades.find(g=>g.grade===11).units;if(m[5].liveMcqCount!==554||m[5].sourceTopicMcqCount!==560||m[5].sourceFigureHeldCount!==6||m.reduce((n,u)=>n+u.liveMcqCount,0)!==2244)process.exit(1)"
      - name: Install real Chromium for accessible SVG and mobile testing
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: V90 6 held item/source keys unchanged and original 4-figure mobile learning page
        run: node scripts/test_unit06_figure_study_v90.cjs
      - name: Regression — V89 central 2,244 and V88 standalone 80 original Superfluidity MCQs
        run: |
          node scripts/test_grade11_unit06_central_v89.cjs
          node scripts/test_unit06_topic67_v88.cjs
      - name: Regression — original held Topic6.1–6.3 and auth/video protections
        run: |
          node scripts/test_unit06_topic61_v76.cjs
          node scripts/test_unit06_topic62_v78.cjs
          node scripts/test_unit06_topic63_v80.cjs
          node scripts/test_grade11_direct_youtube_v74.cjs
      - name: Upload V90 390px source-study screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v90-unit6-figure-study-390px
          path: qa-artifacts/unit06-figures-v90/*.png
          if-no-files-found: warn
          retention-days: 7
