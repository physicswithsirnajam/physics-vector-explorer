<svg role="img" aria-labelledby="fig65title fig65desc" viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg">
<title id="fig65title">A paratrooper's downward speed versus time</title>
<desc id="fig65desc">The downward speed rises from zero to about 50 metres per second in the first 20 seconds, remains at a steady 50 metres per second from about 20 to 42 seconds, falls rapidly when the parachute opens at 42 seconds, and becomes steady at about 8 metres per second from about 47 to 70 seconds.</desc>
<defs><marker id="arr65" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#355876"/></marker></defs>
