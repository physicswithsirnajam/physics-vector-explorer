name: Grade XI V162 Unit7.2 NBF Deformation Study Lesson (UNSCORED)
on:
  pull_request:
    paths:
      - "portal/unit-07-topic72-deformation-v162.html"
      - "portal/unit-07-learning-intro-v145.html"
      - "scripts/test_grade11_v162_unit7_topic72_study.cjs"
      - "quality/grade11-v162-unit7-topic72-deformation-source-and-qc.md"
      - ".github/workflows/validate-grade11-v162-unit7-topic72-study.yml"
  push:
    branches: [main]
    paths:
      - "portal/unit-07-topic72-deformation-v162.html"
      - "portal/unit-07-learning-intro-v145.html"
      - "scripts/test_grade11_v162_unit7_topic72_study.cjs"
      - "quality/grade11-v162-unit7-topic72-deformation-source-and-qc.md"
      - ".github/workflows/validate-grade11-v162-unit7-topic72-study.yml"
  workflow_dispatch:
jobs:
  verify-original-physics-lesson-and-zero-scored-unit7:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check V162 source-aware browser QA
        run: node --check scripts/test_grade11_v162_unit7_topic72_study.cjs
      - name: Preserve 80 original 7.1 source MCQs teacher academic HOLD
        run: node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve 2250 Grade XI original provisional MCQs
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve Unit6 560 teacher-pending academic review locks
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve teacher production NO-GO contract
        run: |
          node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
          node scripts/audit_grade11_v161_staging_callable_contract.cjs
      - name: Preserve exact registered live Firebase App Check initializers
        run: node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
      - name: Install Chromium for authentic interactive student lesson regression
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install chromium
      - name: Verify V162 Unit7.2 original stress-strain calculator, graphics and mobile lesson
        run: node scripts/test_grade11_v162_unit7_topic72_study.cjs
      - name: Preserve existing Unit7.1 source introduction and public navigation
        run: node scripts/test_grade11_v145_unit7_source_intro_browser.cjs
      - name: Upload public synthetic study page screenshots, source-safe summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v162-unit7-topic72-public-study-qc
          path: qa-artifacts/grade11-v162-unit7-topic72-study/
          if-no-files-found: warn
          retention-days: 14
