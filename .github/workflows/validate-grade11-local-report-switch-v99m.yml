name: Grade XI Local Report Emergency OFF Switch (V99-M)
on:
  pull_request:
    paths:
      - "server/local-report-switch-v99m.cjs"
      - "scripts/test_grade11_local_report_switch_v99m.cjs"
      - "server/offline-admin-appcheck-v99l.cjs"
      - "server/offline-review-request-gate-v99k.cjs"
      - "server/local-review-pipeline-v99j.cjs"
      - "server/verified-report-boundary-v99g.cjs"
      - "server/firebase-review-emulator-v99f.cjs"
      - "server/mcq-review-intake-v99e.cjs"
      - "server/pinned-approved-review-catalog-v99i.cjs"
      - "server/review-manifests/grade11-approved-public-review-refs-v99i.json"
      - "shared/mcq-review-contract-v99a.js"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-local-report-switch-v99m.yml"
  push:
    branches: [main]
    paths:
      - "server/local-report-switch-v99m.cjs"
      - "scripts/test_grade11_local_report_switch_v99m.cjs"
      - "server/offline-admin-appcheck-v99l.cjs"
      - "server/offline-review-request-gate-v99k.cjs"
      - "server/local-review-pipeline-v99j.cjs"
      - "server/verified-report-boundary-v99g.cjs"
      - "server/firebase-review-emulator-v99f.cjs"
      - "server/mcq-review-intake-v99e.cjs"
      - "server/pinned-approved-review-catalog-v99i.cjs"
      - "server/review-manifests/grade11-approved-public-review-refs-v99i.json"
      - "shared/mcq-review-contract-v99a.js"
      - "security-proposals/v99j/combined-local-emulators.json"
      - ".github/workflows/validate-grade11-local-report-switch-v99m.yml"
  workflow_dispatch:
jobs:
  local-emulator-report-switch-and-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GCLOUD_PROJECT: demo-psn-v99f-firestore
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check local-only kill switch and tests
        run: |
          node --check server/local-report-switch-v99m.cjs
          node --check scripts/test_grade11_local_report_switch_v99m.cjs
      - name: Install pinned Firebase SDKs and local-only emulators
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase-admin@14.3.0 firebase@13.4.0 firebase-tools@15.37.0
      - name: Verify OFF-by-default switch with local Auth, Firestore and simulated App Check
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v99f-firestore
          "node scripts/test_grade11_local_report_switch_v99m.cjs"
      - name: Upload synthetic test summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-local-report-switch-v99m-evidence
          path: qa-artifacts/switchable-local-review-v99m/summary.json
          if-no-files-found: warn
          retention-days: 14
