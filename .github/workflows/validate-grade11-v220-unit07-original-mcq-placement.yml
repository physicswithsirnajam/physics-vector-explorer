name: Grade XI V220 Unit7 Original MCQ7-9 SLO Placement and Teacher Candidates
on:
  pull_request:
    paths:
      - "quality/unit07/unit07-v220-original-mcq7-8-placement-and-new-application-candidates-no-keys.json"
      - "quality/grade11-v220-unit07-mcq7-8-9-slo-placement-teacher-review.md"
      - "scripts/test_grade11_v220_mcq7_8_slo_application_candidates.cjs"
      - ".github/workflows/validate-grade11-v220-unit07-original-mcq-placement.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit07/unit07-v220-original-mcq7-8-placement-and-new-application-candidates-no-keys.json"
      - "scripts/test_grade11_v220_mcq7_8_slo_application_candidates.cjs"
      - ".github/workflows/validate-grade11-v220-unit07-original-mcq-placement.yml"
jobs:
  validate-original-source-placement-and-unscored-application-questions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify syntax, unchanged source ledgers and draft schema
        run: |
          node --check scripts/test_grade11_v220_mcq7_8_slo_application_candidates.cjs
          node -e "JSON.parse(require('fs').readFileSync('quality/unit07/unit07-v220-original-mcq7-8-placement-and-new-application-candidates-no-keys.json','utf8'))"
      - name: Audit two independent numerical candidates and original SLO placement flags
        run: node scripts/test_grade11_v220_mcq7_8_slo_application_candidates.cjs
      - name: Preserve V219 unapproved previous four MCQ candidates
        run: node scripts/test_grade11_v219_mcq_source_revision_candidates.cjs
      - name: Preserve 2250 existing source MCQ IDs and keyed answer data
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve original 274-item Unit7 inventory and scoring hold
        run: node scripts/audit_grade11_unit07_teacher_approval_index_v178.cjs
