name: Grade XI V144 Read-Only Teacher Own Classes and Roster Local Security
on:
  pull_request:
    paths:
      - "server/local-teacher-classroom-reader-v144.cjs"
      - "scripts/test_grade11_v144_teacher_own_class_reader.cjs"
      - "quality/grade11-v144-teacher-class-roster-read-only-security-rehearsal.md"
      - ".github/workflows/validate-grade11-v144-teacher-own-roster-reader.yml"
  push:
    branches: [main]
    paths:
      - "server/local-teacher-classroom-reader-v144.cjs"
      - "scripts/test_grade11_v144_teacher_own_class_reader.cjs"
      - "quality/grade11-v144-teacher-class-roster-read-only-security-rehearsal.md"
      - ".github/workflows/validate-grade11-v144-teacher-own-roster-reader.yml"
  workflow_dispatch:
jobs:
  verify-local-scoped-teacher-read-and-deny-cross-class:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-psn-v143-classrooms
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax-check V144 trusted teacher class read-only service
        run: |
          node --check server/local-teacher-classroom-reader-v144.cjs
          node --check scripts/test_grade11_v144_teacher_own_class_reader.cjs
      - name: Preserve original 2250 Grade XI public item reference identities
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve 560 pending individual Unit6 teacher approvals and no formal graded release
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve original owner published-rules snapshot attestation safety
        run: node scripts/test_grade11_published_rules_snapshot_v99t.cjs
      - name: Require encrypted original private owner rules for compatibility check
        env:
          PSN_FIRESTORE_BASELINE_RULES: ${{ secrets.PSN_FIRESTORE_BASELINE_RULES }}
        run: |
          if [ -z "$PSN_FIRESTORE_BASELINE_RULES" ]; then
            echo "::error::Private original rules baseline missing; halt safely."
            exit 1
          fi
          echo "Private baseline configured; never printed or uploaded."
      - name: Install pinned local-only Firebase Admin Auth Firestore and emulators
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase-admin@14.3.0 firebase@13.4.0
          @firebase/rules-unit-testing@6.0.0 firebase-tools@15.37.0
      - name: Test teacher T1/C1 and T2/C2 read-only projections and revocations
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v143-classrooms
          "node scripts/test_grade11_v144_teacher_own_class_reader.cjs"
      - name: Preserve V143 admin-only teacher and class provisioning integration
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v143-classrooms
          "node scripts/test_grade11_v143_local_classroom_provisioning.cjs"
      - name: Preserve V142 original private owner full Rules and six-path client denials
        env:
          GCLOUD_PROJECT: demo-psn-v142-classroom
          PSN_FIRESTORE_BASELINE_RULES: ${{ secrets.PSN_FIRESTORE_BASELINE_RULES }}
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99c/emulator-only.json
          --only firestore
          --project demo-psn-v142-classroom
          "node scripts/test_grade11_v142_classroom_private_rules_emulator.cjs"
      - name: Upload aggregate synthetic teacher permissions evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v144-read-only-teacher-roster-security-evidence
          path: |
            qa-artifacts/grade11-v144-read-only-teacher-classroom/summary.json
            qa-artifacts/grade11-v143-admin-classroom-provisioning/summary.json
            qa-artifacts/grade11-v142-classroom-security/summary.json
          if-no-files-found: warn
          retention-days: 14
