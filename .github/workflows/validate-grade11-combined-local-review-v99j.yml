name: Grade XI Local Auth + Firestore + Pinned MCQ Report Integration (V99-J)
on:
  pull_request:
    paths:
      - "server/local-review-pipeline-v99j.cjs"
      - "server/verified-report-boundary-v99g.cjs"
      - "server/firebase-review-emulator-v99f.cjs"
      - "server/mcq-review-intake-v99e.cjs"
      - "server/pinned-approved-review-catalog-v99i.cjs"
      - "server/review-manifests/grade11-approved-public-review-refs-v99i.json"
      - "server/static-review-catalog-v99h.cjs"
      - "shared/mcq-review-contract-v99a.js"
      - "scripts/test_grade11_combined_local_review_v99j.cjs"
      - "security-proposals/v99j/combined-local-emulators.json"
      - "security-proposals/v99c/mcq-review-isolated.rules"
      - ".github/workflows/validate-grade11-combined-local-review-v99j.yml"
  push:
    branches: [main]
    paths:
      - "server/local-review-pipeline-v99j.cjs"
      - "server/verified-report-boundary-v99g.cjs"
      - "server/firebase-review-emulator-v99f.cjs"
      - "server/mcq-review-intake-v99e.cjs"
      - "server/pinned-approved-review-catalog-v99i.cjs"
      - "server/review-manifests/grade11-approved-public-review-refs-v99i.json"
      - "server/static-review-catalog-v99h.cjs"
      - "shared/mcq-review-contract-v99a.js"
      - "scripts/test_grade11_combined_local_review_v99j.cjs"
      - "security-proposals/v99j/combined-local-emulators.json"
      - "security-proposals/v99c/mcq-review-isolated.rules"
      - ".github/workflows/validate-grade11-combined-local-review-v99j.yml"
  workflow_dispatch:
jobs:
  real-local-demo-end-to-end:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GCLOUD_PROJECT: demo-psn-v99f-firestore
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax check local only Auth/Firestore composition and tests
        run: |
          node --check server/local-review-pipeline-v99j.cjs
          node --check scripts/test_grade11_combined_local_review_v99j.cjs
      - name: Install pinned Firebase SDKs and local emulator
        run: >
          npm install --no-save --no-package-lock --ignore-scripts
          firebase-admin@14.3.0 firebase@13.4.0
          @firebase/rules-unit-testing@6.0.0 firebase-tools@15.37.0
      - name: Verify synthetic Firebase Auth tokens, pinned MCQ IDs and actual Firestore commits
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99j/combined-local-emulators.json
          --only auth,firestore
          --project demo-psn-v99f-firestore
          "node scripts/test_grade11_combined_local_review_v99j.cjs"
      - name: Upload only synthetic outcome counts, no tokens or identity data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-local-combined-review-v99j-evidence
          path: qa-artifacts/combined-local-review-v99j/audit.json
          if-no-files-found: warn
          retention-days: 14
