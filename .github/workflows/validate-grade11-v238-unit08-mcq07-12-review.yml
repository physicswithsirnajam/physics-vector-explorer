name: Grade XI V238 Unit 8 Original End MCQs 7-12 Academic Review
on:
  pull_request:
    paths:
      - "quality/unit08/unit08-v238-end-mcq07-12-review-no-keys.json"
      - "quality/unit08/unit08-v238-end-mcq07-12-academic-triage.md"
      - "scripts/test_grade11_v238_unit08_end_mcq07_12_review.cjs"
      - ".github/workflows/validate-grade11-v238-unit08-mcq07-12-review.yml"
  push:
    branches: [main]
    paths:
      - "quality/unit08/unit08-v238-end-mcq07-12-review-no-keys.json"
      - "quality/unit08/unit08-v238-end-mcq07-12-academic-triage.md"
      - "scripts/test_grade11_v238_unit08_end_mcq07_12_review.cjs"
      - ".github/workflows/validate-grade11-v238-unit08-mcq07-12-review.yml"
jobs:
  original-end-mcq-review-no-answers-or-student-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check independent quality ledger and reviewer script syntax
        run: |
          node --check scripts/test_grade11_v238_unit08_end_mcq07_12_review.cjs
          node -e "JSON.parse(require('fs').readFileSync('quality/unit08/unit08-v238-end-mcq07-12-review-no-keys.json','utf8'))"
      - name: V238 original MCQs7-12, SLO level checks and four compulsory answer holds
        run: node scripts/test_grade11_v238_unit08_end_mcq07_12_review.cjs
      - name: Preserve V237 original MCQs1-6 source and science QC
        run: node scripts/test_grade11_v237_unit08_end_mcq01_06_review.cjs
      - name: Preserve V235 full 50-item NBF original exercise inventory
        run: node scripts/test_grade11_v235_unit08_exercise_inventory.cjs
      - name: Preserve V224 official NBF source and FBISE theory SLO inventory
        run: node scripts/test_grade11_v224_unit8_original_source_slo_manifest.cjs
      - name: Preserve exact 2250 pinned Unit1-6 MCQ identities options and keys
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
