name: Grade XI V136 Existing V112 Source-Preserving Scientific Superscripts
on:
  pull_request:
    paths:
      - "scripts/test_grade11_v136_unit3_seconds_display_browser.cjs"
      - "quality/grade11-v136-unit3-formative-seconds-inverse-display-qc.md"
      - ".github/workflows/validate-grade11-v136-unit3-formative-seconds-display.yml"
  push:
    branches: [main]
    paths:
      - "scripts/test_grade11_v136_unit3_seconds_display_browser.cjs"
      - "quality/grade11-v136-unit3-formative-seconds-inverse-display-qc.md"
      - ".github/workflows/validate-grade11-v136-unit3-formative-seconds-display.yml"
  workflow_dispatch:
jobs:
  original-formative-explanations-and-academic-nonrelease:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check original-source V112 browser regression
        run: node --check scripts/test_grade11_v136_unit3_seconds_display_browser.cjs
      - name: Preserve all 2250 original Grade XI MCQ notation candidates
        run: node scripts/test_grade11_math_notation_v131.cjs
      - name: Preserve V128 full Grade XI bank source integrity
        run: node scripts/test_grade11_mcq_triage_v128.cjs
      - name: Preserve pinned 2250 answer-free public source references
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve 560 pending individual Unit6 approvals and formal release hold
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve six-unit readiness and copy-only MCQ issue reports
        run: node scripts/test_grade11_exam_readiness_v118.cjs
      - name: Install pinned Chromium for unchanged V112 scientific formatting in real student reviews
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install chromium
      - name: Verify existing V112 superscripts preserve original s^{-1} in 60-item formative results and instant feedback
        run: node scripts/test_grade11_v136_unit3_seconds_display_browser.cjs
      - name: Upload six source-preserving superscript screenshots and answer-free QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v136-unit3-seconds-inverse-display-evidence
          path: |
            qa-artifacts/grade11-v136-unit3-seconds-inverse-display/
            qa-artifacts/grade11-v131-math-notation-triage/
          if-no-files-found: warn
          retention-days: 14
