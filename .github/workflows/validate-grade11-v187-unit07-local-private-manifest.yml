name: Grade XI V187 Unit7 Local Private Candidate Manifest (NO DEPLOY / NO SCORE)
on:
  pull_request:
    paths:
      - "scripts/unit07_private_candidate_manifest_v187.cjs"
      - "scripts/test_grade11_unit07_private_manifest_v187.cjs"
      - "quality/unit07/unit07-v187-local-private-manifest-contract-no-deploy.json"
      - "quality/grade11-v187-unit07-local-private-manifest-review-qc.md"
      - ".github/workflows/validate-grade11-v187-unit07-local-private-manifest.yml"
  push:
    branches: [main]
    paths:
      - "scripts/unit07_private_candidate_manifest_v187.cjs"
      - "scripts/test_grade11_unit07_private_manifest_v187.cjs"
      - "quality/unit07/unit07-v187-local-private-manifest-contract-no-deploy.json"
      - "quality/grade11-v187-unit07-local-private-manifest-review-qc.md"
      - ".github/workflows/validate-grade11-v187-unit07-local-private-manifest.yml"
  workflow_dispatch:
jobs:
  verify-synthetic-private-file-intake-and-no-real-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check local private intake and invented-only test script
        run: |
          node --check scripts/unit07_private_candidate_manifest_v187.cjs
          node --check scripts/test_grade11_unit07_private_manifest_v187.cjs
      - name: Check local-only keyless manifest, private-path restrictions and academic HOLD
        run: node scripts/test_grade11_unit07_private_manifest_v187.cjs
      - name: Preserve V186 offline synthetic revision hash and revocation protocol
        run: node scripts/test_grade11_unit07_offline_protocol_v186.cjs
      - name: Preserve V185 all 72 source-bound private candidates, unapproved
        run: node scripts/audit_grade11_unit07_teacher_readiness_v185.cjs
      - name: Preserve V184 final compulsory source priority candidates, no score
        run: node scripts/audit_grade11_unit07_teacher_batch06_v184.cjs
      - name: Preserve V183 original 12 source-private teacher candidates, no score
        run: node scripts/audit_grade11_unit07_teacher_batch05_v183.cjs
      - name: Preserve V182 original 12 source-private teacher candidates, no score
        run: node scripts/audit_grade11_unit07_teacher_batch04_v182.cjs
      - name: Preserve V181 original 12 source-private teacher candidates, no score
        run: node scripts/audit_grade11_unit07_teacher_batch03_v181.cjs
      - name: Preserve V180 original 12 source-private teacher candidates, no score
        run: node scripts/audit_grade11_unit07_teacher_batch02_v180.cjs
      - name: Preserve V179 original 12 source-private teacher candidates, no score
        run: node scripts/audit_grade11_unit07_teacher_batch01_v179.cjs
      - name: Preserve V178 274 original Unit7 source identities, no score
        run: node scripts/audit_grade11_unit07_teacher_approval_index_v178.cjs
      - name: Preserve V177 original numerical hint and scientific uncertainty controls
        run: node scripts/audit_grade11_unit07_numericals_v177.cjs
      - name: Preserve V176 original comprehensive question controls
        run: node scripts/audit_grade11_unit07_comprehensive_v176.cjs
      - name: Preserve V175 original short question controls
        run: node scripts/audit_grade11_unit07_short_v175.cjs
      - name: Preserve V174 original textbook MCQ controls
        run: node scripts/audit_grade11_unit07_exercise_mcq_v174.cjs
      - name: Preserve owner original three 80-MCQ source inventories
        run: |
          node scripts/audit_grade11_unit7_topic73_bank_v173.cjs
          node scripts/audit_grade11_unit7_topic72_bank_v168.cjs
          node scripts/audit_grade11_unit7_topic71_teacher_queue_v154.cjs
      - name: Preserve Grade XI 2250 original pinned question source IDs
        run: node scripts/test_grade11_pinned_review_catalog_v99i.cjs
      - name: Preserve original Unit6 560 teacher-science PENDING gate
        run: node scripts/test_grade11_unit06_v94d_signoff_gates.cjs
      - name: Preserve backend staging and production deployment NO-GO
        run: |
          node scripts/audit_grade11_v160_teacher_deployment_no_go.cjs
          node scripts/audit_grade11_v161_staging_callable_contract.cjs
      - name: Preserve App Check browser, reporting and scoring lock
        run: |
          node scripts/audit_grade11_appcheck_browser_entrypoints_v100l.cjs
          node scripts/audit_grade11_reporting_launch_lock_v99u.cjs
      - name: Upload counts-only QA, no real private candidate data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-v187-unit7-local-private-manifest-synthetic-qa
          path: qa-artifacts/grade11-v187-private-manifest-synthetic/summary.json
          if-no-files-found: warn
          retention-days: 14
