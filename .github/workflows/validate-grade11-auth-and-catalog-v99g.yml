name: Grade XI Firebase Auth and Complete Public MCQ Catalog (V99-G)
on:
  pull_request:
    paths:
      - "shared/mcq-review-contract-v99a.js"
      - "server/verified-report-boundary-v99g.cjs"
      - "server/approved-practice-catalog-v99g.cjs"
      - "scripts/test_grade11_verified_auth_catalog_v99g.cjs"
      - "security-proposals/v99g/auth-emulator-only.json"
      - "shared/practice-bank-adapter-v55.js"
      - "question-bank/grade-11/**"
      - ".github/workflows/validate-grade11-auth-and-catalog-v99g.yml"
  push:
    branches: [main]
    paths:
      - "shared/mcq-review-contract-v99a.js"
      - "server/verified-report-boundary-v99g.cjs"
      - "server/approved-practice-catalog-v99g.cjs"
      - "scripts/test_grade11_verified_auth_catalog_v99g.cjs"
      - "security-proposals/v99g/auth-emulator-only.json"
      - "shared/practice-bank-adapter-v55.js"
      - "question-bank/grade-11/**"
      - ".github/workflows/validate-grade11-auth-and-catalog-v99g.yml"
  workflow_dispatch:
jobs:
  auth-emulator-source-lookup-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GCLOUD_PROJECT: demo-psn-v99g-auth-catalog
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax-check strict report contract, approved source loader and Auth request boundary
        run: |
          node --check shared/mcq-review-contract-v99a.js
          node --check server/approved-practice-catalog-v99g.cjs
          node --check server/verified-report-boundary-v99g.cjs
          node --check scripts/test_grade11_verified_auth_catalog_v99g.cjs
      - name: Install pinned Auth emulator and Admin/client SDKs
        run: |
          npm install --no-save --no-package-lock --ignore-scripts firebase-admin@14.3.0 firebase@13.4.0 firebase-tools@15.37.0
      - name: Verify genuine emulator-issued Firebase Auth tokens and complete 2250-item source lookup
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99g/auth-emulator-only.json
          --only auth
          --project demo-psn-v99g-auth-catalog
          "node scripts/test_grade11_verified_auth_catalog_v99g.cjs"
      - name: Preserve only synthetic Auth and source-index evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-auth-approved-catalog-v99g-evidence
          path: qa-artifacts/verified-auth-catalog-v99g/
          if-no-files-found: warn
          retention-days: 14
