name: Grade XI Isolated MCQ Report Firestore Emulator (V99-C)
on:
  pull_request:
    paths:
      - "security-proposals/v99c/mcq-review-isolated.rules"
      - "security-proposals/v99c/emulator-only.json"
      - "scripts/test_grade11_mcq_report_rules_emulator_v99c.cjs"
      - ".github/workflows/validate-grade11-mcq-report-rules-v99c.yml"
  push:
    branches: [main]
    paths:
      - "security-proposals/v99c/mcq-review-isolated.rules"
      - "security-proposals/v99c/emulator-only.json"
      - "scripts/test_grade11_mcq_report_rules_emulator_v99c.cjs"
      - ".github/workflows/validate-grade11-mcq-report-rules-v99c.yml"
  workflow_dispatch:
jobs:
  demo-only-mcq-report-security-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GCLOUD_PROJECT: demo-psn-v99c-review
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax-check strictly local Firestore review-rule test
        run: node --check scripts/test_grade11_mcq_report_rules_emulator_v99c.cjs
      - name: Install pinned Firebase test tools (never production credentials)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts firebase@13.4.0 @firebase/rules-unit-testing@6.0.0 firebase-tools@15.37.0
      - name: Run isolated Firestore emulator against demo-only project
        run: >
          npx firebase emulators:exec
          --config security-proposals/v99c/emulator-only.json
          --only firestore
          --project demo-psn-v99c-review
          "node scripts/test_grade11_mcq_report_rules_emulator_v99c.cjs"
      - name: Preserve simulated allow/deny cases even if an expectation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade11-mcq-report-rules-v99c-evidence
          path: qa-artifacts/mcq-review-rules-v99c/
          if-no-files-found: warn
          retention-days: 14
